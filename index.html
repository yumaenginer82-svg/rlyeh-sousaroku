  }
});

function discover(c, t) {
  const k = key(c, t);
  if (S.dex[k]) return;
  S.dex[k] = true;
  const bonus = 3 * (t + 1) ** 2;
  S.coins += bonus;
  showDiscovery(ITEM(c, t), bonus);
  setTimeout(sfx.discover, 120);
}

function emptyCellsNear(i) {
  const cx = i % COLS, cy = Math.floor(i / COLS);
  return S.cells.map((c, j) => c ? -1 : j).filter(j => j >= 0)
    .sort((a, b) => {
      const da = Math.max(Math.abs(a % COLS - cx), Math.abs(Math.floor(a / COLS) - cy)) * 10 + Math.abs(a % COLS - cx) + Math.abs(Math.floor(a / COLS) - cy);
      const db = Math.max(Math.abs(b % COLS - cx), Math.abs(Math.floor(b / COLS) - cy)) * 10 + Math.abs(b % COLS - cx) + Math.abs(Math.floor(b / COLS) - cy);
      return da - db;
    });
}

function produce(i) {
  const g = S.cells[i];
  const empties = emptyCellsNear(i);
  if (!empties.length) { toast('空きマスがない。合体させるか、売って場所をつくろう'); sfx.bump(); paintM(i, 'shake'); return; }
  const odds = GEN_LV[g.lv];
  let x = Math.random(), t = 0;
  while (t < 2 && x > odds[t]) { x -= odds[t]; t++; }
  if (Math.random() < .03 * relicLv(1)) t = Math.min(t + 1, 3);
  if (g.g === 0 && modOn('tide') && Math.random() < .2) t = Math.min(t + 1, 3);
  bumpTot('p', 1);
  const j = empties[0];
  S.cells[j] = { k: 'item', c: g.g, t };
  // Research: sometimes a second piece comes out.
  const j2 = empties[1];
  if (j2 !== undefined && Math.random() < .08 * resLv('gen')) { S.cells[j2] = { k: 'item', c: g.g, t }; paintM(j2, 'pop'); }
  paintM(i, 'land');
  paintM(j, 'pop');
  sfx.spawn();
  discover(g.g, t);
  afterChange();
}

const sameItem = (a, b) => a && b && a.k === 'item' && b.k === 'item' && a.c === b.c && a.t === b.t;

function drop(a, b) {
  const C = S.cells;
  if (b < 0 || a === b) { paintM(a); return; }
  const s = C[a], d = C[b];
  const moveSel = () => { if (sel === a) sel = b; else if (sel === b) sel = a; };
  if (d && d.k === 'lock') { paintM(a); sfx.bump(); return; }
  if (d && d.k === 'vault' && (s.k === 'item' || s.k === 'chest' || s.k === 'gift')) { stash(a); paintM(b, 'land'); return; }
  if (d && d.k === 'gift' && s.k === 'gift') { mergeGifts(a, b); return; }
  if (d && d.k === 'chest' && s.k === 'chest') { mergeChests(a, b); return; }
  if (d && (d.k === 'fog' || d.k === 'stone' || d.k === 'tent')) {
    if (!gimFits(s, d)) {
      paintM(a); paintM(b, 'shake'); sfx.bump();
      toast(d.k === 'fog' ? '霧の中には置けない。となりで合体すると晴れる' : d.k === 'stone' ? `同じ品（${ITEM(d.c, d.t)[1]}）を重ねると石がくだける` : `触手は「${ITEM(d.need.c, d.need.t)[1]}」を求めている`);
      return;
    }
    C[a] = null; sel = b;
    paintM(a);
    if (d.k === 'stone') {
      C[b] = { k: 'item', c: s.c, t: s.t + 1 };
      floater($('mboard'), COLS, b, '石がくだけた！', 'gold');
      sfx.merge(s.t + 1);
      discover(s.c, s.t + 1);
      if (s.t + 1 >= 4) bumpTot('hi', 1);
      countMerge();
    } else {
      const coins = (10 * 2 ** s.t + 30) * (modOn('fog') ? 2 : 1);
      S.coins += coins;
      C[b] = { k: 'chest', n: 2, lv: Math.min(MAXT, s.t + 1) };
      floater($('mboard'), COLS, b, `触手が帰っていく… 🪙+${coins}`, 'gold');
      sfx.abyss();
      setTimeout(sfx.coin, 300);
    }
    paintM(b, 'pop');
    burst($('mboard'), COLS, b, s.t + 2);
    gimSolved();
    afterChange(); renderInfo();
    return;
  }
  if (!d) {
    C[b] = s; C[a] = null; moveSel();
    paintM(a); paintM(b, 'land'); sfx.move();
    afterChange(); renderInfo();
    return;
  }
  if (sameItem(s, d)) {
    if (s.t >= MAXT) { makeRelic(a, b, s.c); return; }
    const group = cluster(b, a);
    const n = group.length + 1;
    C[a] = null;
    sel = b;
    paintM(a);
    if (n >= 5) {
      // Big merge: 5+ at once yields one extra piece (pairs would leave one over).
      const made = Math.floor(n / 2) + 1;
      group.forEach((j, k) => { C[j] = k < made ? { k: 'item', c: s.c, t: s.t + 1 } : null; });
      group.forEach((j, k) => paintM(j, k < made ? 'pop' : 'puff'));
      burst($('mboard'), COLS, b, s.t + 4);
      floater($('mboard'), COLS, b, `大合体！ ×${made}`, 'gold');
      sfx.merge(s.t + 2);
      setTimeout(sfx.coin, 150);
    } else {
      C[b] = { k: 'item', c: s.c, t: s.t + 1 };
      paintM(b, 'pop');
      burst($('mboard'), COLS, b, s.t + 1);
      sfx.merge(s.t + 1);
    }
    discover(s.c, s.t + 1);
    if (s.t + 1 >= 4) bumpTot('hi', n >= 5 ? Math.floor(n / 2) + 1 : 1);
    maybeChest(b, s.t + 1);
    countMerge();
    clearFog(n >= 5 ? group : [b]);
    afterChange(); renderInfo();
    return;
  }
  C[a] = d; C[b] = s; moveSel();
  paintM(a, 'land'); paintM(b, 'land'); sfx.move();
  afterChange(); renderInfo();
}

function makeRelic(a, b, c) {
  S.cells[a] = null; S.cells[b] = null; sel = -1;
  S.relics = S.relics || [0, 0, 0];
  const n = ++S.relics[c], r = RELICS[c];
  S.coins += RELIC_COINS;
  paintM(a); paintM(b, 'puff');
  burst($('mboard'), COLS, b, 9);
  floater($('mboard'), COLS, b, `${r.n}！`, 'gold');
  sfx.relic();
  // Only the first relic of a kind gets the full reveal; later ones just announce themselves, to keep the pace.
  if (n > 1) {
    toast(`${r.n} ×${n}${n > r.max ? '（効果はもう最大）' : '　力が強まった'}　🪙+${RELIC_COINS}`);
    renderInfo(); afterChange();
    return;
  }
  const lv = '';
  showOverlay(`
    <p class="kicker">古き秘宝</p>
    <div class="relic-art">${ITEM(c, MAXT)[0]}</div>
    <h2>${r.n}${n > 1 ? ` ×${n}` : ''}</h2>
    <p>${r.d}${lv}</p>
    <p class="muted">秘宝は盤面からはなれて、ずっと力をかしてくれる。🪙+${RELIC_COINS}</p>
    <button class="btn primary" type="button" data-go>受けとる</button>
  `, hideOverlay);
  renderInfo(); afterChange();
}

/* ---- chapter twists: fog, petrified items, tentacles ---- */
const isGim = c => c && (c.k === 'fog' || c.k === 'stone' || c.k === 'tent');
const gimFits = (s, d) => s && s.k === 'item' && (d.k === 'stone' ? s.c === d.c && s.t === d.t : d.k === 'tent' ? s.c === d.need.c && s.t === d.need.t : false);
function countMerge() { S.cs = S.cs || {}; S.cs.m = (S.cs.m || 0) + 1; bumpTot('m', 1); }
function clearFog(list) {
  list.forEach(i => {
    const x = i % COLS, y = Math.floor(i / COLS);
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
      const nx = x + dx, ny = y + dy, j = ny * COLS + nx;
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || !S.cells[j] || S.cells[j].k !== 'fog') return;
      const h = S.cells[j].hid;
      S.cells[j] = h;
      paintM(j, 'pop');
      floater($('mboard'), COLS, j, '霧が晴れた', 'gold');
      discover(h.c, h.t);
      gimSolved();
    });
  });
}
function gimSolved() {
  S.cs = S.cs || {}; S.cs.g = (S.cs.g || 0) + 1; bumpTot('g', 1);
  if (S.gimTotal && !S.cells.some(isGim)) {
    const bonus = (40 + 30 * S.ch) * (modOn('fog') ? 2 : 1);
    S.coins += bonus; S.gimTotal = 0;
    setTimeout(() => { sfx.discover(); toast(`この章のしかけをすべて解いた！ 🪙+${bonus}`); renderTop(); save(); }, 1200);
  }
}
function placeGimmicks() {
  S.gimCh = S.ch;
  S.gimTotal = 0;
  const kinds = gimmicksOf(S.ch);
  if (!kinds.length) return;
  const avail = [0, 1, 2].filter(g => S.gens[g]);
  const free = shuffle(S.cells.map((c, i) => c ? -1 : i).filter(i => i >= 0));
  const plan = kinds.flatMap(k => Array(k === 'fog' ? 3 : 2).fill(k)), room = free.length - 6;
  const tier = Math.min(2 + Math.floor(S.ch / 2), 5);
  plan.forEach((k, n) => {
    if (n >= room) return;
    const i = free[n];
    S.cells[i] = k === 'fog' ? { k: 'fog', hid: { k: 'item', c: pick(avail), t: Math.min(1 + Math.floor(S.ch / 2) + rnd(2), 5) } }
      : k === 'stone' ? { k: 'stone', c: pick(avail), t: tier } : { k: 'tent', need: { c: pick(avail), t: tier } };
    S.gimTotal++;
    if (mEls[i]) paintM(i, 'pop');
  });
}

/* ---- gifts: rewards arrive as a parcel on the board; tap to unpack, stack two for a bonus ---- */
function giveGift(list) {
  if (!list.length) return;
  const j = emptyCellsNear(3 * COLS + 3)[0];
  if (j === undefined) { S.inbox.push({ k: 'gift', in: list }); toast('盤面がいっぱい。贈りものは 🎁 に預けておいた'); return; }
  S.cells[j] = { k: 'gift', in: list };
  if (mEls[j]) { paintM(j, 'pop'); setTimeout(() => floater($('mboard'), COLS, j, '贈りもの！', 'gold'), 200); }
}
function openGift(i) {
  const c = S.cells[i];
  const x = c.in[0];
  if (c.in.length > 1) {
    const j = emptyCellsNear(i)[0];
    if (j === undefined) { toast('空きマスがない。場所をあけてから開けよう'); sfx.bump(); paintM(i, 'shake'); return; }
    c.in.shift();
    S.cells[j] = x;
    paintM(i, 'land'); paintM(j, 'pop');
  } else {
    S.cells[i] = x; sel = -1;
    paintM(i, 'pop');
  }
  burst($('mboard'), COLS, i, 3);
  sfx.spawn();
  if (x.k === 'item') discover(x.c, x.t);
  renderInfo();
  afterChange();
}
function mergeGifts(a, b) {
  const C = S.cells, all = C[b].in.concat(C[a].in);
  const avail = [0, 1, 2].filter(g => S.gens[g]);
  const t = Math.min(5, 1 + Math.floor(all.length / 2));
  all.push({ k: 'item', c: pick(avail), t });
  C[b] = { k: 'gift', in: all };
  C[a] = null; sel = b;
  paintM(a); paintM(b, 'pop');
  burst($('mboard'), COLS, b, 4);
  floater($('mboard'), COLS, b, `まとまった！ おまけ ${ITEM(all[all.length - 1].c, t)[1]}`, 'gold');
  sfx.merge(3);
  afterChange(); renderInfo();
}
// Two chests stack into one (all the opens of both), so a board full of chests never locks up.
function mergeChests(a, b) {
  const C = S.cells;
  C[b] = { k: 'chest', n: C[a].n + C[b].n, lv: Math.max(C[a].lv, C[b].lv) };
  C[a] = null; sel = b;
  paintM(a); paintM(b, 'pop');
  floater($('mboard'), COLS, b, `宝箱がまとまった（あと${C[b].n}回）`, 'gold');
  sfx.merge(2);
  afterChange(); renderInfo();
}
// The sealed chest lives on the board as a piece of its own.
function ensureVault() {
  if (S.cells.some(c => c && c.k === 'vault')) return;
  const j = emptyCellsNear(0)[0];
  if (j !== undefined) S.cells[j] = { k: 'vault' };
}
function paintVault() { const j = S.cells.findIndex(c => c && c.k === 'vault'); if (j >= 0 && mEls[j]) paintM(j); }

// Orthogonally connected identical items starting at b (b first, nearest first), ignoring the dragged cell.
function cluster(b, skip) {
  const ref = S.cells[b], seen = new Set([b]), out = [b];
  for (let q = 0; q < out.length; q++) {
    const i = out[q], x = i % COLS, y = Math.floor(i / COLS);
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
      const nx = x + dx, ny = y + dy, j = ny * COLS + nx;
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || seen.has(j) || j === skip) return;
      seen.add(j);
      if (sameItem(ref, S.cells[j])) out.push(j);
    });
  }
  return out;
}

const CHEST_ODDS = [0, 0, 0, .2, .35, .5, .6, .7];
function maybeChest(i, t) {
  if (!CHEST_ODDS[t] || Math.random() >= CHEST_ODDS[t] + .05 * relicLv(2) + (modOn('moon') ? .15 : 0)) return;
  const chest = { k: 'chest', n: t, lv: t };
  const j = emptyCellsNear(i)[0];
  if (j === undefined) { S.inbox.push(chest); toast('宝箱が出た！ 🎁 に入れておいた'); }
  else { S.cells[j] = chest; paintM(j, 'pop'); }
  setTimeout(() => { sfx.discover(); floater($('mboard'), COLS, j === undefined ? i : j, '宝箱！', 'gold'); }, 250);
}

function openChest(i) {
  const c = S.cells[i];
  const avail = [0, 1, 2].filter(g => S.gens[g]);
  const t = Math.min(MAXT, rnd(2) + (c.lv - 3) + rnd(2) + (Math.random() < .12 * resLv('chest') ? 1 : 0));
  const item = { k: 'item', c: pick(avail), t: Math.max(0, t) };
  c.n--;
  bumpTot('c', 1);
  findScrap(.03, '宝箱の底');
  if (c.n <= 0) {
    S.cells[i] = item;
    sel = -1;
    paintM(i, 'pop');
  } else {
    const j = emptyCellsNear(i)[0];
    if (j === undefined) { c.n++; toast('空きマスがない。場所をあけてから開けよう'); sfx.bump(); paintM(i, 'shake'); return; }
    S.cells[j] = item;
    paintM(i, 'land');
    paintM(j, 'pop');
  }
  sfx.spawn();
  discover(item.c, item.t);
  renderInfo();
  afterChange();
}

function tapM(i) {
  const c = S.cells[i];
  if (c && c.k === 'gen') { select(i); produce(i); }
  else if (c && c.k === 'chest') { select(i); openChest(i); }
  else if (c && c.k === 'gift') { select(i); openGift(i); }
  else if (c && c.k === 'vault') { select(i); showStore(); }
  else if (c) select(i);
  else select(-1);
}

function afterChange() {
  checkAchs();
  paintVault();
  renderOrders();
  renderTop();
  save();
}

/* ================= orders ================= */
function itemIndex() {
  const m = {};
  S.cells.forEach((c, i) => { if (c && c.k === 'item') (m[key(c.c, c.t)] = m[key(c.c, c.t)] || []).push(i); });
  return m;
}

function renderOrders() {
  const idx = itemIndex();
  wantSet = new Set();
  // A normal request that would use up something the climax request needs gets flagged.
  const bossKeys = new Set(S.boss ? S.boss.need.map(n => key(n.c, n.t)) : []);
  const clash = o => !o.boss && o.need.some(n => bossKeys.has(key(n.c, n.t)));
  const html = [S.boss, ...S.orders].filter(Boolean).map(o => {
    if (!(S.met = S.met || []).includes(o.npc.n)) S.met.push(o.npc.n);
    const used = {};
    let ready = true;
    const needs = o.need.map(n => {
      const k = key(n.c, n.t), have = (idx[k] || []).length - (used[k] || 0);
      used[k] = (used[k] || 0) + 1;
      const ok = have > 0;
      if (!ok) ready = false;
      (idx[k] || []).forEach(i => wantSet.add(i));
      return `<span class="need" title="${ITEM(n.c, n.t)[1]}">${ITEM(n.c, n.t)[0]}${ok ? '<i></i>' : ''}</span>`;
    }).join('');
    return `<div class="order${ready ? ' ready' : ''}${o.sp ? ' special' : ''}${o.boss ? ' boss' : ''}${clash(o) ? ' clash' : ''}${o.rare ? ' rare' : ''}" data-oid="${o.id}">
      <div class="npc" data-who="${o.npc.n}">${FACE(o.npc.n)}<div class="whot"><span class="nm">${o.npc.n}</span><span class="say">「${askOf(o)}」</span></div>${o.sp ? '<span class="sp-tag">特別</span>' : o.boss ? '<span class="sp-tag boss-tag">山場</span>' : o.rare ? '<span class="sp-tag rare-tag">超レア</span>' : ''}</div>
      <div class="orow"><div class="needs">${needs}</div>
      <div class="foot"><span class="rew">🪙${orderCoins(o)}${o.stars ? ' ★' + o.stars : ''}${o.eyes ? ' 👁️' + o.eyes : ''}</span><button class="btn tiny gold" type="button" data-deliver="${o.id}" ${ready ? '' : 'disabled'}>納品</button></div></div>
    </div>`;
  }).join('');
  $('orders').innerHTML = html || '<div class="empty-orders">新しい依頼を待っている…</div>';
  mEls.forEach((el, i) => el.classList.toggle('want', wantSet.has(i)));
}

$('orders').addEventListener('click', e => {
  const b = e.target.closest('[data-deliver]');
  if (b && !b.disabled) { deliver(+b.dataset.deliver); return; }
  // Tapping a client's name shows who they are in the info panel.
  const w = e.target.closest('[data-who]');
  if (w && whoIs(w.dataset.who)) {
    select(-1);
    const card = w.closest(".order"), oid = card ? +card.dataset.oid : -1;
    const o = S.boss && S.boss.id === oid ? S.boss : S.orders.find(x => x.id === oid);
    $("info").innerHTML = `<div class="big">${FACE(w.dataset.who)}</div><div class="txt"><b>${w.dataset.who}<small>依頼主</small></b>${o ? `<p class="ask">「${askOf(o)}」</p>` : ""}<p class="muted">${whoIs(w.dataset.who)}</p></div>`;
  }
});

function deliver(id) {
  const o = S.boss && S.boss.id === id ? S.boss : S.orders.find(x => x.id === id);
  if (!o) return;
  const taken = [];
  for (const n of o.need) {
    const j = S.cells.findIndex((c, i) => !taken.includes(i) && c && c.k === 'item' && c.c === n.c && c.t === n.t);
    if (j < 0) return;
    taken.push(j);
  }
  taken.forEach(j => { S.cells[j] = null; if (sel === j) sel = -1; paintM(j, 'puff'); });
  const g = goal(S.ch), before = S.stars;
  const coins = orderCoins(o);
  S.coins += coins;
  S.stars += o.stars;
  if (o.stars && Math.random() < .12 * resLv('order')) { S.stars++; setTimeout(() => toast('町の信頼が厚い。★がひとつ多くもらえた'), 1500); }
  if (!o.boss) findScrap(.03, '依頼主の荷物');
  if (o.eyes) S.eyes += o.eyes;
  S.orders = S.orders.filter(x => x.id !== id);
  S.cs = S.cs || {}; S.cs.o = (S.cs.o || 0) + 1; bumpTot('o', 1);
  sfx.coin();
  if (o.boss) {
    S.boss = null; S.bossDone = true;
    giveGift([{ k: 'chest', n: 3, lv: 4 + Math.min(2, Math.floor(S.ch / 2)) }]);
    showThanks(o.npc.n, thanksOf(o), `🪙+${coins} 👁️+${o.eyes} 宝箱`);
    searchReadyNotice('道がひらけた。この章の最後の現場検証へ向かえる。');
  } else showThanks(o.npc.n, thanksOf(o), `🪙+${coins} ★+${o.stars}${o.eyes ? ` 👁️+${o.eyes}` : ""}`);
  if (o.rare) setTimeout(senaVisit, 1600);
  renderInfo();
  afterChange();
  if (before < g && S.stars >= g) {
    if (!lastStage()) searchReadyNotice('町の人々から、手がかりがそろった。');
    else if (!S.bossDone && !S.boss) { makeBoss(); renderOrders(); setTimeout(showBoss, 900); }
  }
  setTimeout(() => { fillOrders(); renderOrders(); save(); }, 900);
}

/* ================= sealed chest (storage) and the abyss (discard) ================= */
const STORE_CAP = [4, 6, 8, 10, 12], STORE_COST = [0, 80, 200, 500, 1200];
const storeCap = () => STORE_CAP[S.storeLv || 0];
const storeFull = () => (S.store || []).length >= storeCap();
const cellArt = c => c.k === 'item' ? ITEM(c.c, c.t)[0] : c.k === 'gift' ? GIFT : CHEST;

// While an item is dragged, the info panel turns into the abyss drop target (and the store, if its chest isn't on the board).
function showDropZones(c) {
  const box = $('info'), onBoard = S.cells.some(x => x && x.k === 'vault');
  box.innerHTML = `${onBoard ? `<div class="dz hint"><b>${VAULT}</b><small>盤面の「封印の櫃」に重ねると、しまえる</small></div>`

}
function zoneAt(x, y) {
  for (const el of document.querySelectorAll('#info .dz')) {
    const r = el.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom && !el.classList.contains('full')) return el.dataset.dz;

}
function stash(i) {

  S.coins += SELL[c.t];

  S.cells[i] = null;
  floater($('mboard'), COLS, i, `深淵へ… 🪙+${SELL[c.t]}`, 'gold');

}
function showStore() {

  const slots = [...Array(cap).keys()].map(n => st[n]
    ? `<button class="slot" type="button" data-take="${n}">${cellArt(st[n])}<small>${st[n].k === 'item' ? ITEM(st[n].c, st[n].t)[1] : st[n].k === 'gift' ? '贈りもの' : '宝箱'}</small></button>`
    : '<div class="slot empty"></div>').join('');
  showOverlay(`
    <p class="kicker">封印の櫃</p>
    <h2>${st.length} / ${cap}</h2>
    <p class="muted">盤面の品をドラッグして説明欄の「櫃」に落とすと、ここにしまえる。タップで盤面に出す。</p>
    <div class="slots">${slots}</div>
    ${cost ? `<button class="btn tiny gold" type="button" id="storeUp" ${S.coins < cost ? 'disabled' : ''}>櫃を広げる（+2） 🪙${cost}</button>` : '<p class="muted">これ以上は広げられない</p>'}
    <button class="btn primary" type="button" data-go>とじる</button>
  `, hideOverlay);
  $('panel').querySelectorAll('[data-take]').forEach(b => b.addEventListener('click', () => {
    const empties = emptyCellsNear(3 * COLS + 3);
    if (!empties.length) { toast('空きマスがない。場所をあけてから出そう'); sfx.bump(); return; }

}

$('dayBtn').addEventListener('click', showDaily);

function unlockRow() {
  const row = [...Array(ROWS).keys()].find(r => S.cells.slice(r * COLS, r * COLS + COLS).some(c => c && c.k === 'lock'));
  if (row === undefined) return false;
  for (let c = 0; c < COLS; c++) { const i = row * COLS + c; if (S.cells[i] && S.cells[i].k === 'lock') S.cells[i] = null; }
  return row;
}

/* ================= merge input ================= */
let drag = null;
function idxAt(board, cols, rows, x, y) {
  const r = board.getBoundingClientRect(), size = r.width / cols;
  const cx = Math.floor((x - r.left) / size), cy = Math.floor((y - r.top) / size);
  if (cx < 0 || cy < 0 || cx >= cols || cy >= rows) return -1;
  return cy * cols + cx;
}
const mb = $('mboard');
mb.addEventListener('pointerdown', e => {
  if (!S || S.view !== 'merge' || drag || !$('overlay').hidden) return;
  const i = idxAt(mb, COLS, ROWS, e.clientX, e.clientY);
  if (i < 0) return;
  e.preventDefault();
  try { mb.setPointerCapture(e.pointerId); } catch (err) {}
  drag = { i, x: e.clientX, y: e.clientY, id: e.pointerId, moving: false, dead: false, ghost: null, over: -1 };
});
mb.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || drag.dead) return;
  if (!drag.moving) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 9) return;
    const c = S.cells[drag.i];
    if (!c || c.k === 'lock' || isGim(c)) { drag.dead = true; return; }
    drag.moving = true;
    const g = document.createElement('div');
    g.className = 'ghost';
    g.innerHTML = c.k === 'gen' ? CHAINS[c.g].gen.e : c.k === 'vault' ? VAULT : cellArt(c);
    g.style.width = g.style.height = (mb.clientWidth / COLS) * 1.05 + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    mEls[drag.i].classList.add('lift');
    if (c.k !== 'gen' && c.k !== 'vault') showDropZones(c);
    if (c.k === 'item') S.cells.forEach((o, j) => { if (j !== drag.i && (sameItem(c, o) || (o && gimFits(c, o)))) mEls[j].classList.add('match'); });
  }
  drag.ghost.style.transform = `translate(${e.clientX}px,${e.clientY}px) translate(-50%,-70%) scale(1.15)`;
  const z = zoneAt(e.clientX, e.clientY);
  document.querySelectorAll('#info .dz').forEach(el => el.classList.toggle('on', el.dataset.dz === z));
  const over = idxAt(mb, COLS, ROWS, e.clientX, e.clientY);
  if (over !== drag.over) {
    (drag.hl || []).forEach(j => mEls[j].classList.remove('hover', 'can'));

    if (over >= 0 && over !== drag.i && !(oc && oc.k === 'lock')) {
      const s = S.cells[drag.i];
      if (sameItem(s, oc) && s.t < MAXT) {

      } else drag.hl = [over];   // final stage pairs make a relic, one at a time
      const fits = sameItem(s, oc) || (oc && (gimFits(s, oc) || (oc.k === 'vault' && s.k !== 'gen') || (oc.k === 'gift' && s.k === 'gift') || (oc.k === 'chest' && s.k === 'chest')));

function endDrag(e, cancelled) {

/* ================= search (hidden-object scene) ================= */
function mulberry(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const newSearch = ch => ({ seed: (Math.random() * 1e9) | 0, ch, found: [], stage: stageOf(), ex: (S.used || []).slice(), mode: isDiffStage() ? 'diff' : undefined });

// Everything about a scene comes from its seed, so a saved search redraws identically.
// Listed items are hidden with hidden-object tricks: blending into busy areas, odd sizes,
// odd angles, lining up with boards and posts, blind spots, and being partly covered.
function layoutScene(s) {
  if (theme(s.ch).hs && HIDDEN[theme(s.ch).hs]) return layoutHidden(s, theme(s.ch));
  // Until a chapter has its own drawn-in picture, use one that does.
  const drawn = THEMES.find(t => t.hs && HIDDEN[t.hs]);
  if (drawn) return layoutHidden(s, drawn);
  const R = mulberry(s.seed), th = theme(s.ch), spots = SPOTS[th.bg];
  const rp = a => a[Math.floor(R() * a.length)];
  const rr = (a, b) => a + R() * (b - a);
  const sh = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let targets = sh(th.items.filter(e => FINDS[e])).slice(0, findCount(s.ch));
  const clutter = th.items.filter(e => !targets.includes(e));
  targets.forEach(e => { const l = LOOKALIKE[e]; if (l && !targets.includes(l)) clutter.push(l, l); });

  const spotOf = (kinds, id) => {
    const c = spots.filter(p => kinds.includes(p.k) && (p.k !== 'sky' || FLY.has(id)));
    return c.length ? rp(c) : rp(spots.filter(p => p.k === 'floor'));
  };
  // Natural size for a spot, before any trick changes it.
  const place = (id, p) => {
    const x = rr(p.x0, p.x1) * SW;
    let y, s, r = rr(-12, 12);
    if (p.k === 'shelf') { s = rr(66, 90); y = p.y0 * SH - s * .36; r = rr(-6, 6); }
    else {
      y = rr(p.y0, p.y1) * SH;
      if (p.k === 'floor') { const d = (y / SH - p.y0) / Math.max(.01, p.y1 - p.y0); s = rr(96, 136) * (.75 + d * .5); r = rr(-40, 40); }
      else if (p.k === 'sky') s = rr(56, 76);
      else if (p.k === 'busy') s = rr(62, 86);
      else s = rr(72, 98);
    }
    return { e: id, x, y, s, r, a: 1, flip: R() < .3, kind: p.k };
  };

  const items = [];
  const T = [];
  const free = (x, y, gap) => T.every(t => Math.hypot(t.x - x, t.y - y) > gap);
  const safe = it => it.x > 140 && it.x < SW - 260 && it.y > 80 && it.y < SH - 150;
  const tricks = ['natural', 'busy', 'flip', 'behind', 'line', 'busy'];
  if (s.ch >= 1) tricks.push('tiny', 'edge', 'flip');
  if (s.ch >= 2) tricks.push('huge', 'tiny', 'behind', 'edge');

  targets.forEach((id, k) => {
    for (let tries = 0; tries < 40; tries++) {
      const trick = tries < 30 ? rp(tricks) : 'natural';
      let it, over = null;
      if (trick === 'busy') { it = place(id, spotOf(['busy'], id)); it.s *= .9; it.a = .72; }
      else if (trick === 'tiny') { it = place(id, spotOf(['floor', 'shelf', 'busy'], id)); it.s = rr(40, 50); it.a = .9; }
      else if (trick === 'huge') { it = place(id, spotOf(['floor', 'hang'], id)); it.s = rr(240, 320); it.a = .4; }
      else if (trick === 'flip') { it = place(id, spotOf(['floor', 'shelf', 'hang', 'busy'], id)); it.r = rp([180, 90, -90]) + rr(-8, 8); it.a = .88; }
      else if (trick === 'edge') { it = place(id, spotOf(['edge'], id)); it.a = .85; }
      else if (trick === 'line' && LONG.has(id)) {
        it = place(id, spotOf(['floor', 'edge'], id));
        it.r = rp([90, -90, 0, 180]) + rr(-5, 5); it.a = .85;   // follows boards, posts and ledges
      } else if (trick === 'behind') {
        it = place(id, spotOf(['floor', 'shelf'], id)); it.a = .95;
        const cover = rp(clutter);
        over = { e: cover, x: it.x + rp([-1, 1]) * it.s * rr(.3, .42), y: it.y + it.s * rr(.1, .3), s: it.s * rr(1.05, 1.3), r: rr(-15, 15), a: 1, flip: R() < .5, over: true };
      } else { it = place(id, spotOf(['floor', 'shelf', 'hang', 'busy', 'sky'], id)); it.a = .92; }
      if (!safe(it) || !free(it.x, it.y, 260)) continue;
      it.t = k; it.trick = trick;
      T.push(it);
      items.push(it);
      if (over) items.push(over);
      return;
    }
  });
  targets = targets.slice(0, T.length);
  T.forEach((t, k) => { t.t = k; });

  // Decoys: fewer than before, all sitting where things would really be. Lookalikes included.
  const n = 90 + s.ch * 8;
  const kinds = ['floor', 'floor', 'floor', 'shelf', 'shelf', 'shelf', 'hang', 'hang', 'busy', 'busy', 'busy', 'edge', 'edge', 'sky'];
  for (let k = 0, tries = 0; k < n && tries < n * 6; tries++) {
    const id = rp(clutter);
    const it = place(id, spotOf([rp(kinds)], id));
    // never sit on top of a listed item (only its chosen cover may)
    if (T.some(t => Math.hypot(t.x - it.x, t.y - it.y) < (t.s + it.s) * .4)) continue;
    if (items.some(o => !o.over && o.t === undefined && Math.hypot(o.x - it.x, o.y - it.y) < (o.s + it.s) * .22)) continue;
    it.a = rr(.85, 1);
    items.push(it);
    k++;
  }
  // back to front; a cover is drawn right after the item it hides
  items.forEach(it => { it.z = it.over ? it.y + 2000 : it.y; });
  items.sort((a, b) => a.z - b.z);
  return { seed: s.seed, th, items, T };
}

const imgCache = new Map();
function loadImg(src) {
  if (!imgCache.has(src)) imgCache.set(src, new Promise((ok, fail) => {
    const im = new Image();
    im.onload = () => ok(im);
    im.onerror = () => fail(new Error(src));
    im.src = src;
  }));
  return imgCache.get(src);
}
const sprites = {};

// Engravings sit on white paper, so multiply lets the backdrop show through the white.
function drawItem(g, it) {
  const im = sprites[it.e];
  if (!im) return;
  g.save();
  g.globalCompositeOperation = 'multiply';
  g.globalAlpha = it.a == null ? 1 : it.a;
  g.translate(it.x, it.y);
  g.rotate(it.r * Math.PI / 180);
  if (it.flip) g.scale(-1, 1);
  g.drawImage(im, -it.s / 2, -it.s / 2, it.s, it.s);
  g.restore();
}
// A found item is coloured in with a watercolour wash, then its lines are re-inked on top.
function drawFound(g, t) {
  const col = WASH[(t.e.length * 7 + t.e.charCodeAt(0)) % WASH.length];
  const r = Math.max(30, t.s * .5);
  g.save();
  g.globalCompositeOperation = 'multiply';
  const gr = g.createRadialGradient(t.x, t.y, 0, t.x, t.y, r);
  gr.addColorStop(0, col + '.8)');
  gr.addColorStop(.65, col + '.55)');
  gr.addColorStop(1, col + '0)');
  g.fillStyle = gr;
  g.beginPath(); g.arc(t.x, t.y, r, 0, Math.PI * 2); g.fill();
  g.restore();
  drawItem(g, Object.assign({}, t, { a: 1 }));
}

let scn = null;
async function renderScene() {
  const s = S.search, cv = $('scv');
  $('sload').hidden = false;
  $('sload').textContent = '情景を描いています…';
  $('slayer').querySelectorAll('.mark,.hintring,.miss,.float').forEach(el => el.remove());
  const L = layoutScene(s);
  const ids = [...new Set(L.items.map(it => it.e))];
  let bg;
  try {
    [bg] = await Promise.all([loadImg(`assets/${L.hidden ? L.th.hs : L.th.bg}.jpg`), ...ids.map(id => loadImg(findSrc(id)).then(im => { sprites[id] = im; }))]);
  } catch (e) {
    $('sload').textContent = '画像を読み込めませんでした。通信状態を確認して、もう一度開いてください。';
    return;
  }
  if (!S.search || S.search.seed !== s.seed) return;   // the player left or changed scene meanwhile
  cv.width = SW * SRES; cv.height = SH * SRES;
  cv.style.width = SW + 'px'; cv.style.height = SH + 'px';
  $('slayer').style.width = SW + 'px'; $('slayer').style.height = SH + 'px';
  const g = cv.getContext('2d');
  g.setTransform(SRES, 0, 0, SRES, 0, 0);
  const k = Math.max(SW / bg.width, SH / bg.height);
  g.drawImage(bg, (SW - bg.width * k) / 2, (SH - bg.height * k) / 2, bg.width * k, bg.height * k);
  L.items.forEach(it => drawItem(g, it));

  if (L.hidden) L.T.forEach(t => {
    const [x, y, r] = t.at[0].src, c = document.createElement('canvas');
    c.width = c.height = 192;   // shown at up to ~130 CSS px, sharp on Retina
    c.getContext('2d').drawImage(bg, x - r * 1.15, y - r * 1.15, r * 2.3, r * 2.3, 0, 0, 192, 192);
    t.thumb = c.toDataURL('image/jpeg', .85);
  });
  L.T.forEach(t => {
    // colour in the copies already tapped (older saves only know that the item was found: use its first copy)
    const parts = (s.parts || {})[t.t] || (s.found.includes(t.t) ? [0] : []);
    parts.forEach(n => { const p = t.at ? t.at[n] : t; if (!p) return; const at = Object.assign({}, t, { x: p.x, y: p.y, s: p.s }); drawFound(g, at); addMark(at); });
  });

  const RB = mulberry(s.seed + 7), blurN = s.ch >= 2 ? Math.min(3, s.ch - 1) : 0;
  L.T.filter(t => !t.all).map(t => [RB(), t]).sort((a, b) => a[0] - b[0]).slice(0, blurN).forEach(([, t]) => { t.blur = true; });
  scn = L;
  $('sload').hidden = true;

/* ---- view: pinch zoom / pan ---- */
const V = { z: 1, x: 0, y: 0, min: .2, max: 2 };
function applyView(glide) {
  const r = $('sview').getBoundingClientRect();
  V.z = Math.min(V.max, Math.max(V.min, V.z));
  const w = SW * V.z, h = SH * V.z;
  V.x = w <= r.width ? (r.width - w) / 2 : Math.min(0, Math.max(r.width - w, V.x));
  V.y = h <= r.height ? (r.height - h) / 2 : Math.min(0, Math.max(r.height - h, V.y));
  const L = $('slayer');
  L.classList.toggle('glide', !!glide);
  L.style.transform = `translate(${V.x}px,${V.y}px) scale(${V.z})`;
  L.style.setProperty('--inv', 1 / V.z);
}
function fitView() {
  const r = $('sview').getBoundingClientRect();
  if (!r.width || !r.height) return;
  V.min = Math.min(r.width / SW, r.height / SH);
  V.max = Math.max(V.min * 6, 1.5);
  // Open filling the frame (no letterbox), centred on the crowded lower half.
  V.z = Math.min(Math.max(r.width / SW, r.height / SH), V.min * 2.2);
  V.x = (r.width - SW * V.z) / 2;
  V.y = r.height - SH * V.z * .82;
  applyView();
}
function zoomAt(f, cx, cy, glide) {
  const wx = (cx - V.x) / V.z, wy = (cy - V.y) / V.z;
  V.z = Math.min(V.max, Math.max(V.min, V.z * f));
  V.x = cx - wx * V.z; V.y = cy - wy * V.z;
  applyView(glide);
}
function onSviewResize() {
  if (!scn) return;
  const r = $('sview').getBoundingClientRect();
  if (!r.width) return;
  const atMin = V.z <= V.min + 1e-6;
  V.min = Math.min(r.width / SW, r.height / SH);
  V.max = Math.max(V.min * 6, 1.5);
  if (atMin || V.z < V.min) V.z = V.min;
  applyView();
}

const sv = $('sview'), ptrs = new Map();
let gest = null;
const local = e => { const r = sv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
sv.addEventListener('pointerdown', e => {
  if (!scn || S.view !== 'search' || !$('overlay').hidden || e.target.closest('button')) return;
  e.preventDefault();
  try { sv.setPointerCapture(e.pointerId); } catch (err) {}
  const p = local(e);
  ptrs.set(e.pointerId, p);
  if (ptrs.size === 1) gest = { mode: 'tap', sx: p.x, sy: p.y, vx: V.x, vy: V.y };
  else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    gest = { mode: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, z: V.z, vx: V.x, vy: V.y };
    $('ptip').hidden = true;
  }
});
sv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || !gest) return;
  const p = local(e);
  ptrs.set(e.pointerId, p);
  if (gest.mode === 'pinch') {
    if (ptrs.size < 2) return;
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const wx = (gest.mx - gest.vx) / gest.z, wy = (gest.my - gest.vy) / gest.z;
    V.z = Math.min(V.max, Math.max(V.min, gest.z * d / gest.d));
    V.x = mx - wx * V.z; V.y = my - wy * V.z;
    applyView();
    return;
  }
  const dx = p.x - gest.sx, dy = p.y - gest.sy;
  if (gest.mode === 'tap' && Math.hypot(dx, dy) > 9) { gest.mode = 'pan'; $('ptip').hidden = true; }
  if (gest.mode === 'pan') { V.x = gest.vx + dx; V.y = gest.vy + dy; applyView(); }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  const p = ptrs.get(e.pointerId);
  ptrs.delete(e.pointerId);
  if (gest && gest.mode === 'tap' && e.type === 'pointerup') tapWorld((p.x - V.x) / V.z, (p.y - V.y) / V.z);
  if (!ptrs.size) gest = null;
  else if (gest && gest.mode === 'pinch') { const q = [...ptrs.values()][0]; gest = { mode: 'pan', sx: q.x, sy: q.y, vx: V.x, vy: V.y }; }

sv.addEventListener('pointerup', endPtr);
sv.addEventListener('pointercancel', endPtr);
sv.addEventListener('wheel', e => {
  if (!scn) return;
  e.preventDefault();
  const p = local(e);
  zoomAt(Math.exp(-e.deltaY * .0015), p.x, p.y);
}, { passive: false });
const zoomCenter = f => { const r = sv.getBoundingClientRect(); zoomAt(f, r.width / 2, r.height / 2, true); };
$('zin').addEventListener('click', () => zoomCenter(1.6));
$('zout').addEventListener('click', () => zoomCenter(1 / 1.6));
$('zfit').addEventListener('click', () => { V.z = V.min; applyView(true); });

/* ---- finding ---- */
function inWorld(cls, x, y, size, text) {
  const el = document.createElement('div');
  el.className = cls;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  if (size) el.style.width = el.style.height = size + 'px';
  if (text) el.textContent = text;
  $('slayer').appendChild(el);
  return el;
}
const addMark = t => inWorld('mark', t.x, t.y, t.s * 1.3);

function tapWorld(wx, wy) {
  const s = S.search;
  const slop = Math.min(16 / V.z, 26);   // finger tolerance, capped so tapping zoomed-out isn't a free pass
  s.parts = s.parts || {};
  const got = t => s.parts[t.t] || [];
  const near = scn.T.filter(t => !s.found.includes(t.t))
    .flatMap(t => (t.at || [t]).map((p, n) => ({ t, p, n, d: Math.hypot(p.x - wx, p.y - wy) })))
    .filter(o => o.d < o.p.s * .55 + slop)
    .sort((a, b) => a.d - b.d)[0];
  // A "find them all" copy counts once: tapping one already found again does nothing (not a miss, not its neighbour).
  if (near && got(near.t).includes(near.n)) return;
  // Outside "find them all", only the copy shown on the card counts; tapping a look-alike elsewhere is a miss.
  const hit = near && (near.t.all || near.n === 0) ? near : null;
  if (hit) {
    const t = hit.t, at = Object.assign({}, t, { x: hit.p.x, y: hit.p.y, s: hit.p.s });
    s.parts[t.t] = got(t).concat(hit.n);   // which copy was tapped, so a reload colours the same one
    const total = t.all ? t.at.length : 1, n = s.parts[t.t].length;
    if (n >= total) s.found.push(t.t);
    drawFound($('scv').getContext('2d'), at);
    addMark(at);
    const f = inWorld('float sfloat ok', at.x, at.y - at.s * .7, 0, `${t.ja || FINDS[t.e]}${t.all ? ` ${n}/${total}` : ''}！`);
    setTimeout(() => f.remove(), 1200);
    sfx.found();
    renderFinds();
    save();
    if (s.found.length >= scn.T.length) setTimeout(searchClear, 1300);
  } else {
    s.miss = (s.miss || 0) + 1;
    const m = inWorld('miss', wx, wy, 0, '×');
    const f = inWorld('float sfloat bad', wx, wy - 30 / V.z, 0, `正気度 −${missCost()}`);
    setTimeout(() => f.remove(), 1000);
    renderFinds();
    save();
    setTimeout(() => m.remove(), 700);
    sfx.wrong();
  }
}

// Sanity as a draining gauge: green → amber → red; a drop shakes the scene, and below 45 the edges pulse like a heartbeat.
function paintSan(el, san, scene) {
  const prev = el.dataset.v === undefined ? san : +el.dataset.v, r = rateOf(san);
  el.dataset.v = san;
  el.className = 'san gauge r' + r;
  el.innerHTML = `<b>正気度</b><span class="sbar"><i style="width:${san}%"></i></span><em>${san}</em><span class="srate">${starsText(r)}</span>`;
  scene.classList.toggle('shaken', san < 45);
  if (san < prev) {
    // the shake plays once; leaving the class on would replay it whenever the view is shown again
    [el, scene].forEach(x => { x.classList.remove('hit'); void x.offsetWidth; x.classList.add('hit'); x.addEventListener('animationend', () => x.classList.remove('hit'), { once: true }); });
    if (san < 45) osc(55, { type: 'sine', vol: .12, dur: .35, slide: .7 });   // a low thump
  }
}
function renderFinds() {
  if (!S.search || !scn) return;
  const s = S.search, T = scn.T.slice().sort((a, b) => (b.all ? 1 : 0) - (a.all ? 1 : 0) || a.t - b.t);   // "find them all" card first
  $("mTitle").textContent = `${story(s.ch).mission}　${s.found.length} / ${T.length}`;
  const san = sanOf(s);

    dgest = { d: Math.hypot(a.x - b.x, a.y - b.y), moved: true, vp: dgest && dgest.vp || e.target.closest('.dvp') };
  } else dgest = { moved: false, vp: e.target.closest('.dvp') };
});
$('dpanes').addEventListener('pointermove', e => {
  const p = dptr.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (dptr.size === 2 && dgest && dgest.d) {
    const [a, b] = [...dptr.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    const box = dgest.vp.getBoundingClientRect();   // the picture the pinch started on
    zoomDZ(d / dgest.d, (a.x + b.x) / 2 - box.left, (a.y + b.y) / 2 - box.top);
    dgest.d = d;
  } else if (dptr.size === 1) {
    if (Math.hypot(e.clientX - p.x0, e.clientY - p.y0) > 8) dgest.moved = true;
    if (dgest.moved && DZ.z > 1) { DZ.x += dx; DZ.y += dy; applyDZ(); }
  }
});
const dEnd = e => {
  const had = dptr.has(e.pointerId), moved = dgest && dgest.moved;
  dptr.delete(e.pointerId);
  if (!dptr.size) dgest = null;
  if (e.type === 'pointerup' && (!had || !moved)) diffTap(e);   // synthetic taps without a pointerdown still count
};
$('dpanes').addEventListener('pointerup', dEnd);

function diffTap(e) {
  // with the pointer captured by the picture area, the event's target is that area: find the picture under the finger
  const c = e.target.closest('canvas') || document.elementsFromPoint(e.clientX, e.clientY).find(el => el.tagName === 'CANVAS' && el.closest('#dpanes'));
  if (!c || !dscn || !S.search || S.search.mode !== 'diff') return;
  const rc = c.getBoundingClientRect(), k = dscn.W / rc.width;
  const x = (e.clientX - rc.left) * k, y = (e.clientY - rc.top) * k, s = S.search;
  // A tap counts when it lands on the changed object's own box, give or take a fingertip (about 14 screen px);
  // a round area sized by the longer side would reach far past a tall or wide object.
  const slop = 14 * k + 6;
  const hit = dscn.pts.map((p, i) => ({ p, i, d: Math.hypot(Math.max(p.x0 - x, 0, x - p.x1), Math.max(p.y0 - y, 0, y - p.y1)) }))
    .filter(o => o.d <= slop).sort((a, b) => a.d - b.d || Math.hypot(a.p.x - x, a.p.y - y) - Math.hypot(b.p.x - x, b.p.y - y))[0];
  if (hit && s.found.includes(hit.i)) return;
  if (hit) {
    s.found.push(hit.i);
    markDiff(hit.i, true);
    sfx.found();
    renderDiffHead();
    save();
    if (s.found.length >= dscn.pts.length) setTimeout(() => showDiffAnswers(() => { dscn = null; searchClear(); }), 1300);
  } else {
    s.miss = (s.miss || 0) + 1;
    const m = document.createElement('div'), kc = c.clientWidth / dscn.W;
    m.className = 'dmiss'; m.textContent = '×';
    m.style.left = x * kc + 'px'; m.style.top = y * kc + 'px';
    c.parentNode.appendChild(m);
    setTimeout(() => m.remove(), 700);
    sfx.wrong();
    renderDiffHead();
    save();
  }
}
$('dEye').addEventListener('click', () => {

// The rating block shown when a search is solved: stars, sanity left and the chapter's record.
const rateHtml = (r, san, stats) => `<div class="rating r${r}">${starsText(r)}</div>
    <p class="muted">残った正気度 <b>${san}</b>${stats ? `　／　合体 ${stats.m}回・依頼 ${stats.o}件・しかけ ${stats.g}個` : ''}</p>`;
// A new title for the total of best ratings; each step pays once.
function titleUp(list) {
  const lv = titleLv();
  if (lv <= (S.titleLv || 0)) return '';
  S.titleLv = lv;
  const coins = 40 * lv;
  S.coins += coins; S.eyes += 1;
  list.push(`🎖 称号のほうび 🪙${coins} 👁️1`);
  return `<p class="title-up">称号が上がった：<b>${TITLES[lv][1]}</b></p>`;
}

function searchClear() {
  const s = S.search, san = sanOf(s), r = rateOf(san);
  S.log = S.log || {};
  if (s.replay) return replayClear(s, san, r);
  bumpTot('f', s.mode === 'diff' ? (s.found || []).length : scn ? scn.T.length : 0);
  if (r === 3) bumpTot('s3', 1);
  S.rates = (S.rates || []).concat(r);
  if (!lastStage()) return stageClear(s, san, r);
  const ch = S.ch, st = story(ch);
  const coins = 40 + 30 * ch;
  const list = [`🪙 ${coins}`, '👁️ 千里眼 ×1'];
  S.coins += coins;
  S.eyes += 1;
  if (RATE_COINS(ch)[r]) { S.coins += RATE_COINS(ch)[r]; list.push(`${starsText(r)} 評価のほうび 🪙${RATE_COINS(ch)[r]}`); }
  if (r === 3) { S.eyes += 1; list.push('👁️ 正気を保ったほうび ×1'); }
  const stats = Object.assign({ m: 0, o: 0, g: 0 }, S.cs);
  const rates = S.rates.slice(), cr = Math.max(1, Math.round(rates.reduce((a, b) => a + b, 0) / rates.length));   // the chapter rating: all its searches
  S.log[ch] = { stars: cr, san, m: stats.m, o: stats.o, g: stats.g };
  const titleHtml = titleUp(list);
  giveShard(ch, list);
  findScrap(.45, '現場');
  const row = unlockRow();
  if (row !== false) list.push('✴ 盤面の封印が一列とけた');
  const gift = [];
  if (!S.gens[2]) { S.gens[2] = true; gift.push({ k: 'gen', g: 2, lv: 1 }); list.push(`${CHAINS[2].gen.e} 祭壇（新しい道具）`); }
  const avail = [0, 1, 2].filter(g => S.gens[g]);
  const gt = Math.min(2 + Math.floor(ch / 2), 4);
  for (let k = 0; k < 2; k++) {
    const c = pick(avail);
    gift.push({ k: 'item', c, t: gt });
    list.push(`${ITEM(c, gt)[0]} ${ITEM(c, gt)[1]}`);
  }
  gift.push({ k: 'chest', n: 3, lv: 4 });
  list.push(`${CHEST} 宝箱`);

  fillOrders();
  afterChange();
  sfx.seal();
  showOverlay(`
    <p class="kicker">${ch === FINAL_CH ? '最終章' : `第${ch + 1}章`} 解決</p>
    <h2>${st.mission}</h2>

    <p class="muted">章の評価は、3回の現場検証の平均（${rates.map(starsText).join("　")}）</p>
    ${st.outro ? `<p class="lore">${st.outro}</p>` : ''}
    ${titleHtml}
    <ul class="rewards">${list.map(x => `<li>${x}</li>`).join('')}</ul>

// Re-running a solved chapter's scene: only a better rating pays (the difference), the story doesn't move.
function replayClear(s, san, r) {
  const ch = s.ch, prev = S.log[ch] || { stars: 0, san: 0, m: 0, o: 0, g: 0 };
  const list = [];
  let head = 'これまでの記録は超えられなかった。';
  if (r > prev.stars) {
    const coins = RATE_COINS(ch)[r] - RATE_COINS(ch)[prev.stars];
    if (coins > 0) { S.coins += coins; list.push(`評価が上がった 🪙${coins}`); }
    if (r === 3) { S.eyes += 1; list.push('👁️ 正気を保ったほうび ×1'); }
    head = '記録を塗りかえた！';
  }
  S.log[ch] = Object.assign({}, prev, { stars: Math.max(prev.stars, r), san: Math.max(prev.san, san) });
  const titleHtml = titleUp(list);
  S.search = null;
  scn = null;
  setView('merge');
  afterChange();
  sfx.seal();
  showOverlay(`
    <p class="kicker">${chName(ch)} 再調査</p>
    <h2>${story(ch).mission}</h2>
    ${rateHtml(r, san)}
    <p class="lore">${head}</p>
    ${titleHtml}
    ${list.length ? `<ul class="rewards">${list.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
    <button class="btn primary" type="button" data-go>依頼にもどる</button>
  `, hideOverlay);
}

/* ================= seal shards: one per chapter, offered in order at the altar before the ending ================= */
const SHARDS = [
  { n: '錨の鍵', d: '記者が酒場に隠していた古い鍵。錆の下から、錨の印がのぞく。' },
  { n: '金の冠', d: '人の頭には合わない、いびつな冠。海の神の頭上に置かれるべきもの。' },
  { n: '教団の聖杯', d: '集会所の祭壇にあった杯。祈りの言葉で満たされるという。' },
  { n: '暗礁の黒石', d: '悪魔の暗礁から欠け落ちた石。海を鎮める力が宿っている。' },
  { n: '深きものの仮面', d: '祭りの夜に拾った仮面。顔を隠し、人ではないものに化けるための品。' },

const ALTAR_VERSE = '錨は扉をひらき　冠は頭上に戴かれ<br>杯は祈りに満ち　石は海を鎮める<br>仮面は顔を隠し　最後に言葉が記される';
const shardArt = i => ICON(`assets/x-s${i}.png`);
function giveShard(ch, list) {
  if (ch >= SHARDS.length) return;
  S.shards = S.shards || [];
  if (S.shards.includes(ch)) return;

// The moment a shard is won: it rises out of the dark with a burst of light, and the six slots show how many are left.
function showShardGet(ch, then) {
  const have = S.shards || [];
  sfx.relic();
  showOverlay(`
    <p class="kicker">封印の欠片を手に入れた！</p>

    <p class="muted">${have.length < SHARDS.length ? `欠片は ${have.length} / ${SHARDS.length}。すべてそろえば、都を眠りへ還す封印ができる。` : '六つの欠片がそろった。あとは、星辰の刻を待つだけだ。'}</p>
    <button class="btn primary" type="button" data-go>大切にしまう</button>
  `, then);
}
// The offering: put the six shards on the altar in the order the verse tells. A wrong one costs a little sanity.
function showAltar() {
  const placed = [], order = SHARDS.map((_, i) => i);
  let wrong = 0;
  const pool = shuffle((S.shards || order).slice());
  const draw = msg => {
    showOverlay(`
      <p class="kicker">星辰の祭壇</p>
      <h2>封印の儀</h2>
      <p class="lore verse">${ALTAR_VERSE}</p>
      <div class="altar">${order.map(i => `<div class="pedestal${placed[i] !== undefined ? ' lit' : ''}">${placed[i] !== undefined ? shardArt(placed[i]) : `<span>${i + 1}</span>`}</div>`).join('')}</div>
      <p class="muted">${msg || '詩のとおりの順に、欠片を選んで祭壇に捧げよ。'}${wrong ? `　（失った正気度 ${wrong * 10}）` : ''}</p>
      <div class="shards">${pool.filter(i => !placed.includes(i)).map(i => `<button class="shard" type="button" data-sh="${i}">${shardArt(i)}<b>${SHARDS[i].n}</b><small>${SHARDS[i].d}</small></button>`).join('')}</div>
      ${placed.length === order.length ? '<button class="btn primary" type="button" data-go>封印を完成させる</button>' : ''}
    `, () => { hideOverlay(); showEnding(); });
    $('panel').querySelectorAll('[data-sh]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.sh, next = placed.length;
      if (i === order[next]) {
        placed.push(i); sfx.relic();
        draw(placed.length === order.length ? '六つの欠片が光を放ち、祭壇の紋が目を覚ました。' : `「${SHARDS[i].n}」が祭壇に吸いこまれた。`);
      } else {
        wrong++; sfx.wrong();
        b.classList.add('nope');
        setTimeout(() => draw(`「${SHARDS[i].n}」は、まだその時ではないらしい。頭の奥がずきりと痛む。`), 500);

    }));
  };
  sfx.seal();
  draw();
}

function showEnding(replay) {
  const E = $('ending'), T = $('etext'), R = $('eroll');
  E.hidden = false; E.classList.remove('roll', 'wake'); R.innerHTML = ''; T.innerHTML = '';
  stopDrone();
  let i = 0, timer = 0, stage = 'story';
  // After the credits: you wake up, and it isn't over. Lines appear one by one on a dark screen.
  const epilogue = () => {
    if (stage === 'epi') return;
    stage = 'epi';
    clearTimeout(timer);
    E.classList.remove('roll'); E.classList.add('wake');
    R.innerHTML = ''; T.innerHTML = '';
    $('eskip').hidden = true;
    let j = 0;
    const step = () => {
      clearTimeout(timer);
      if (j < EPILOGUE.length) {
        const last = j === EPILOGUE.length - 1;
        T.insertAdjacentHTML('beforeend', `<p class="wline${last ? ' whisper' : ''}">${EPILOGUE[j++]}</p>`);
        if (last) { sfx.abyss(); timer = setTimeout(step, 5200); } else { bubble(0, 300); timer = setTimeout(step, 3600); }
        return;
      }
      T.onclick = null;
      T.insertAdjacentHTML('beforeend', `${replay ? '' : '<p class="after">封印のほうび：🪙1000　👁️5　実績「封印者」</p>'}
        <button class="btn primary wbtn" type="button" id="eend">${replay ? 'とじる' : 'その後の調査へ'}</button>`);
      $('eend').addEventListener('click', e => {
        e.stopPropagation();
        E.hidden = true; E.classList.remove('wake'); $('eskip').hidden = false;
        if (!muted) startDrone();
        if (!replay) showIntro();
      });
    };
    T.onclick = step;
    timer = setTimeout(step, 1800);
  };
  const finish = () => {
    if (stage !== 'story') { epilogue(); return; }
    stage = 'roll';
    clearTimeout(timer);
    E.classList.add('roll');
    T.innerHTML = '';
    T.onclick = null;
    R.innerHTML = `<div class="rollin">
      <h1>ルルイエ捜索録</h1><p class="rsub">― The R'lyeh Inquiry ―</p>
      <h3>企画</h3><p>yachi</p>
      <h3>探索者</h3><p>mitsu</p>
      <h3>物語・プログラム</h3><p>Claude</p>
      <h3>絵</h3><p>Gemini</p>
      <h3>依頼主</h3>${[...NPCS, ...BOSSES, MERCHANT].map(p => `<p>${p.n}</p>`).join('')}
      <h3>特別出演</h3><p>ヨークシャテリア セナ</p>
      <h3>原典</h3><p>H・P・ラヴクラフト</p><p>『ダゴン』『クトゥルフの呼び声』</p><p>『インスマスを覆う影』『ダンウィッチの怪』</p>
    </div>`;
    R.querySelector('.rollin').addEventListener('animationend', () => setTimeout(epilogue, 1500));
    $('eskip').onclick = epilogue;
  };
  const next = () => {
    clearTimeout(timer);
    if (i >= ENDING.length) { finish(); return; }
    T.innerHTML = `<p class="eline">${ENDING[i++]}</p>`;
    sfx.discover();
    timer = setTimeout(next, 6500);
  };
  T.onclick = next;
  $('eskip').hidden = false;
  $('eskip').onclick = finish;
  if (!replay) { S.coins += 1000; S.eyes += 5; afterChange(); }
  setTimeout(next, 900);
}

  $('panel').querySelectorAll('[data-replay]').forEach(b => b.addEventListener('click', () => {
    if (S.search) return;
    S.search = Object.assign(newSearch(+b.dataset.replay), { replay: true, stage: 0, ex: [], mode: undefined });
    hideOverlay();
    setView('search');
  }));
  let armed = false;
  $('resetBtn').addEventListener('click', () => {
    if (!armed) { armed = true; $('resetBtn').textContent = '本当に消す（もとに戻せません）'; return; }
    newGame();
  });
}
$('dexBtn').addEventListener('click', showDex);
$('mute').addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem('rlyeh-muted', muted ? '1' : '0'); } catch (e) {}
  renderTop();
  if (muted) stopDrone(); else { sfx.spawn(); startDrone(); }
});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
// iOS Safari can still double-tap-zoom despite touch-action. Cancel the second quick tap's default (the zoom)
// and deliver its click by hand, so rapid tapping on buttons keeps working. Pointer events are unaffected.
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = e.timeStamp;
  if (now - lastTouchEnd < 450 && !e.touches.length && !e.target.closest('input,textarea,select')) {
    e.preventDefault();
    if (e.target.click) e.target.click();
  }
  lastTouchEnd = now;
}, { passive: false });
// Offline cache for the home-screen install; only on a standalone host, not inside the artifact viewer.
if ('serviceWorker' in navigator && window.top === window && location.protocol === 'https:') {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}

/* ================= title screen ================= */
function newGame() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  freshState(); sel = -1; scn = null;
  setView('merge'); buildMerge(); renderAll();
  hideTitle();
  showIntro();
}
function hideTitle() {
  const t = $('title');
  t.classList.add('gone');
  setTimeout(() => { t.hidden = true; }, 600);
}
const APP_VERSION = 'ver 1.59';   // shown on the title screen; bump with each release
function showTitle(hasSave) {
  $('tver').textContent = APP_VERSION;
  const t = $('title');
  t.hidden = false; t.classList.remove('gone');
  const where = `${S.ch === FINAL_CH ? "最終章" : `第${S.ch + 1}章`}「${story(S.ch).title}」`;
  $('tbtns').innerHTML = hasSave
    ? `<button class="btn primary tgo" type="button" data-t="go">つづきから<small>${where}</small></button>
       <button class="btn tb" type="button" data-t="new">はじめから</button>`
    : `<button class="btn primary tgo" type="button" data-t="go">ゲームスタート</button>`;
  $('tbtns').insertAdjacentHTML('beforeend', `<div class="trow">
    <button class="btn tb" type="button" data-t="help">遊び方</button>
    ${hasSave ? `<button class="btn tb" type="button" data-t="dex"><img class="uic" src="assets/x-ui-book.png" alt="">手帳</button>` : ''}
    <button class="btn tb snd${muted ? ' off' : ''}" type="button" data-t="snd"><img class="uic" src="assets/x-ui-sound.png" alt="">${muted ? '音：オフ' : '音：オン'}</button></div>`);
  let armed = false;
  $('tbtns').onclick = e => {
    const b = e.target.closest('[data-t]');
    if (!b) return;
    const k = b.dataset.t;
    if (k === 'go') {
      if (!muted) { sfx.seal(); startDrone(); }
      hideTitle();
      if (S.introCh !== S.ch) setTimeout(showIntro, 300);
      else if (dailyReady()) setTimeout(showDaily, 300);
    } else if (k === 'new') {
      if (!armed) { armed = true; b.classList.add('danger'); b.textContent = '本当に最初から？（セーブが消えます）'; return; }
      newGame();
    } else if (k === 'dex') showDex();
    else if (k === 'help') showHelp('merge');
    else if (k === 'snd') { $('mute').click(); showTitle(hasSave); }
  };
}

/* ================= boot ================= */
function renderAll() {
  renderOrders();
  renderTop();
  renderInfo();
  S.cells.forEach((_, i) => paintM(i));
}
function boot(data) {
  S = (data && data.S && data.S.v === 2) ? data.S : loadSave();
  const saved = S;
  if (!S) freshState();
  // Older saves: the climax request, chapter twists, board vault and board gifts are new.
  // Saves from before the three-search chapters: a search already under way is the chapter's last one.
  if (S.stage === undefined) {
    if (S.search && !S.search.replay) S.bossDone = true;
    S.stage = (S.boss || S.bossDone) ? STAGES - 1 : 0;
    if (S.search && !S.search.replay) S.search.stage = S.stage;
  }
  if (!S.search && lastStage() && S.stars >= goal(S.ch) && !S.bossDone && !S.boss) makeBoss();
  if (S.gimCh !== S.ch) placeGimmicks();
  ensureDaily();
  if (!S.shards) S.shards = [...Array(Math.min(S.ch, SHARDS.length)).keys()];   // chapters solved before shards existed
  // Saves from before the help page already know how to play.
  if (!S.seen && S.introCh >= 0) S.seen = { merge: true, search: S.ch > 0, gim: S.ch > 1 };
  ensureVault();
  if (S.inbox.length && !S.inbox.some(x => x.k === 'gift')) { const list = S.inbox; S.inbox = []; giveGift(list); }
  fillOrders();
  sel = -1;
  buildMerge();
  renderAll();
  if (S.search && !S.search.seed) S.search = null;   // saves from the crowd-search version
  setView(S.search && S.view === 'search' ? 'search' : 'merge');
  showTitle(!!saved);
}
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ S })); } catch (e) {}
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
