<title>ルルイエ捜索録</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ルルイエ捜索録">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1518">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: one-screen game. Header strip, then the active view:
   merge view = requests + info panel + 7x9 board; search view = wanted cards + crowd scene.
   Landscape iPad puts the panels in a left rail. Deliberately single dark theme. */
:root{
  --abyss:#0a1518;
  --ink:#03090b;
  --line:#3b6b62;
  --bone:#e6dcc3;
  --stripe:#c0353d;
  --glow:#72e0b2;
  --paper:#11242a;
  --panel2:#0d1d21;
  --tile-a:#16302e;
  --tile-b:#122927;
  --stone-a:#1b2327;
  --stone-b:#161d21;
  --wood:#4b3a2a;
  --wood-dark:#1f160f;
  --gold:#c9a34a;
  --veil:rgba(2,7,9,.74);
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--abyss)}
/* touch-action isn't inherited: give every element "no double-tap zoom"; boards and the scene override it with none */
*,*::before,*::after{touch-action:manipulation}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:radial-gradient(ellipse 120% 70% at 50% 115%,#123b35 0%,var(--abyss) 65%) var(--abyss);color:var(--bone);
  font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:10px}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--paper);border:2px solid var(--line);border-radius:16px;
  padding:10px 14px;box-shadow:0 4px 0 var(--ink);position:relative;overflow:hidden}
.top::before,.panel::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,transparent,var(--glow),transparent)}
.brand{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--glow);letter-spacing:.08em;text-shadow:0 0 10px rgba(114,224,178,.4)}
.chapter{display:flex;align-items:baseline;gap:8px;min-width:0}
.chapter span{font-size:12px;opacity:.7;letter-spacing:.08em}
.chapter b{font-family:var(--f-display);font-size:17px;white-space:nowrap}
.prog{display:flex;align-items:center;gap:8px;flex:1 1 140px;min-width:120px}
.pbar{flex:1;height:12px;border-radius:999px;background:#071012;border:1px solid var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6d2a,var(--gold));transition:width .4s}
.prog span{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--gold)}
.res{display:flex;gap:8px}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.hbtns{display:flex;gap:6px;margin-left:auto}

/* Buttons */
.btn{font-family:var(--f-body);font-weight:700;font-size:15px;color:var(--bone);background:#173238;border:2px solid var(--line);border-radius:12px;
  padding:8px 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 0 var(--ink);touch-action:manipulation;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.38;cursor:default;transform:none;box-shadow:0 3px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.small{padding:6px 10px;font-size:14px}
.btn.tiny{padding:4px 10px;font-size:13px;border-radius:10px}
.btn.gold{background:var(--gold);color:var(--ink);border-color:#e3c77a}
.btn.danger{background:#5a1a1e;border-color:var(--stripe)}
.btn.primary{background:var(--stripe);color:#fff;border-color:#e0646b;font-family:var(--f-display);font-size:19px;padding:12px 26px;letter-spacing:.08em}
.btn b{font-variant-numeric:tabular-nums}

/* Views */
.view{min-height:0;min-width:0;display:grid;gap:10px}
.merge{grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"orders" "board" "info"}
.search{grid-template-rows:auto minmax(0,1fr);grid-template-areas:"orders" "board"}
.side{grid-area:orders;display:flex;flex-direction:column;gap:8px;min-width:0}
.wrap{grid-area:board;position:relative;min-width:0;min-height:0;display:grid;place-items:center;contain:size}
.info{grid-area:info}

/* Orders */
.orders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.order{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0;
  box-shadow:0 3px 0 var(--ink);transition:border-color .2s,box-shadow .2s}
.order.ready{border-color:var(--gold);box-shadow:0 3px 0 var(--ink),0 0 16px rgba(201,163,74,.35)}
.npc{display:flex;align-items:center;gap:6px;min-width:0}
.npc .face{font-size:22px}
.npc .nm{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.needs{display:flex;gap:6px}
.need{position:relative;width:44px;height:44px;display:grid;place-items:center;font-size:28px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.need i{position:absolute;right:-5px;top:-5px;width:18px;height:18px;border-radius:50%;background:var(--glow);color:var(--ink);font-size:12px;font-style:normal;font-weight:700;display:grid;place-items:center}
.foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.rew{font-size:13px;font-weight:700;color:var(--gold);white-space:nowrap}
.investigate{animation:beckon 2.2s ease-in-out infinite}
.empty-orders{grid-column:1/-1;font-size:13px;opacity:.7;padding:8px}

/* Info panel */
.info{display:flex;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 3px 0 var(--ink);
  height:104px;box-sizing:border-box;overflow-y:auto;overflow-x:hidden}   /* fixed, so picking a different item never resizes the board */
.info .big{font-size:44px;line-height:1;width:56px;text-align:center;flex:none}
.info .txt{flex:1;min-width:0}
.info .txt b{font-family:var(--f-display);font-size:17px}
.info .txt small{font-family:var(--f-body);font-size:12px;color:var(--gold);margin-left:4px}
.info p{margin:2px 0 0;font-size:13px;line-height:1.55}
.info .acts{display:flex;flex-direction:column;gap:6px;flex:none}
/* Drop targets that replace the info panel while dragging */
.info .dz{flex:1;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px dashed var(--line);border-radius:12px;
  font-size:14px;transition:background .15s,border-color .15s,transform .15s;position:relative;overflow:hidden;min-width:0}
.info .dz small{font-size:12px;opacity:.8}
.info .dz.on{border-style:solid;border-color:var(--gold);background:rgba(201,163,74,.15);transform:scale(1.03)}
.info .dz.full{opacity:.45}
.info .dz.abyss{border-color:#3d6b7a;background:radial-gradient(circle at 50% 50%,#050b10 0%,#0b2530 55%,transparent 75%)}
.info .dz.abyss.on{border-color:var(--glow);background:radial-gradient(circle at 50% 50%,#000 0%,#0d3a40 60%,transparent 80%)}
.vortex{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,rgba(114,224,178,.0) 0 18deg,rgba(114,224,178,.16) 18deg 24deg);
  border-radius:50%;animation:swirl 3.5s linear infinite;pointer-events:none}
.info .dz.abyss.on .vortex{animation-duration:1.2s}
.info .dz.abyss b,.info .dz.abyss small{position:relative}
@keyframes swirl{to{transform:rotate(360deg)}}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.slot{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:4px;color:inherit;font:inherit;cursor:pointer}
.slot .ic{width:70%;height:auto;aspect-ratio:1}
.slot small{font-size:10px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot.empty{border-style:dashed;opacity:.5;cursor:default}
.muted{opacity:.7}

/* Boards */
.board{position:relative;display:grid;grid-template-columns:repeat(var(--cols,7),var(--cell,48px));grid-auto-rows:var(--cell,48px);
  border:2px solid var(--line);border-radius:16px;box-shadow:0 5px 0 var(--ink),0 0 40px rgba(114,224,178,.1);touch-action:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.45) 100%),
    repeating-conic-gradient(var(--tile-a) 0 25%,var(--tile-b) 0 50%) 0 0/calc(var(--cell,48px)*2) calc(var(--cell,48px)*2)}
.board.scene{background:radial-gradient(ellipse at 50% 40%,rgba(114,224,178,.06),rgba(0,0,0,.55) 100%),
    repeating-conic-gradient(var(--stone-a) 0 25%,var(--stone-b) 0 50%) 0 0/calc(var(--cell,48px)*2) calc(var(--cell,48px)*2)}
.cell{position:relative;display:grid;place-items:center;font-size:calc(var(--cell,48px)*.66);line-height:1}
.cell .p{display:grid;place-items:center;width:100%;height:100%;position:relative}
.cell .e{display:block;transform:rotate(var(--r,0deg));filter:drop-shadow(0 2px 1px rgba(0,0,0,.6))}
.cell .t3 .e,.cell .t4 .e{filter:drop-shadow(0 0 4px var(--gold))}
.cell .t5 .e{filter:drop-shadow(0 0 7px var(--glow)) drop-shadow(0 0 2px var(--glow))}
.cell .gen::before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,rgba(114,224,178,.28),rgba(114,224,178,.04) 70%);
  border:2px solid rgba(114,224,178,.5);animation:breathe 3s ease-in-out infinite}
.cell .lv{position:absolute;right:4%;bottom:4%;font-size:calc(var(--cell,48px)*.18);font-family:var(--f-body);font-weight:700;background:var(--gold);color:var(--ink);
  border-radius:6px;padding:1px 4px;line-height:1.2}
.cell .prop{opacity:.75;font-size:.85em}
.cell .cover{font-size:1.12em;animation:sway 4.2s ease-in-out infinite}
.card{cursor:pointer}
.order.special{border-color:var(--stripe);background:linear-gradient(160deg,#2a1418,var(--paper) 60%)}
.order.special.ready{box-shadow:0 3px 0 var(--ink),0 0 18px rgba(192,53,61,.55)}
.sp-tag{font-size:11px;font-weight:700;color:#fff;background:var(--stripe);border-radius:6px;padding:1px 6px;margin-left:auto;white-space:nowrap}
.seal{width:88%;height:88%;border:2px solid #000;border-radius:6px;position:relative;
  background:repeating-linear-gradient(0deg,var(--wood) 0 30%,var(--wood-dark) 30% 34%);box-shadow:inset 0 0 8px rgba(0,0,0,.7)}
.seal::after{content:"✴";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cell,48px)*.4);color:var(--glow);opacity:.5;
  text-shadow:0 0 6px var(--glow);animation:sigil 3.5s ease-in-out infinite}
.cell.want{background:radial-gradient(circle,rgba(201,163,74,.32),transparent 62%)}
.cell.sel::after{content:"";position:absolute;inset:3%;border:3px solid var(--glow);border-radius:14px;box-shadow:0 0 10px var(--glow);pointer-events:none}
.cell::before{content:"";position:absolute;inset:6%;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .12s}
.cell.match::before{opacity:1;background:rgba(114,224,178,.22)}
.cell.hover::before{opacity:1;background:rgba(230,220,195,.3)}
.cell.can::before{opacity:1;background:var(--gold)}
.cell.lift .p{opacity:.2}
.cell.found::after{content:"";position:absolute;inset:2%;border:4px solid var(--stripe);border-radius:50%;pointer-events:none;box-shadow:0 0 10px var(--stripe)}
.cell.got::after{animation:ring .5s ease-out}
.cell.pop .p{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.cell.land .p{animation:land .2s ease-out}
.cell.shake .p{animation:shake .4s}
.cell.wiggle .p{animation:wiggle .35s}
.dust{position:absolute;inset:8%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,var(--glow) 0 18%,rgba(114,224,178,.25) 40%,transparent 65%);animation:dust .6s ease-out forwards}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;line-height:1;filter:drop-shadow(0 8px 6px rgba(0,0,0,.6))}
.spark{position:absolute;z-index:12;width:8px;height:8px;border-radius:50%;pointer-events:none;background:var(--glow);box-shadow:0 0 8px var(--glow);
  transform:translate(-50%,-50%);animation:spark .6s ease-out forwards}
.spark.gold{background:var(--gold);box-shadow:0 0 10px var(--gold);width:10px;height:10px}
.float{position:absolute;z-index:20;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap;font-family:var(--f-display);font-weight:800;
  font-size:18px;color:var(--bone);text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink);animation:float 1.1s ease-out forwards}
.float.ok{color:var(--glow)}
.float.gold{color:var(--gold)}
.float.bad{color:#ff8a8f}
.scope{position:absolute;z-index:15;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--glow);
  background:radial-gradient(circle,rgba(114,224,178,.16),transparent 70%);box-shadow:0 0 18px var(--glow),0 0 0 9999px rgba(0,0,0,.5);animation:scope 3.4s ease-out forwards}

/* Search header */
.mission{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 3px 0 var(--ink);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.mission h2{margin:0;font-family:var(--f-display);font-size:18px;letter-spacing:.06em;flex:1 1 100%}
.mission h2 small{display:block;font-family:var(--f-body);font-size:12px;opacity:.7;letter-spacing:.1em}
.cards{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 auto}
.card{position:relative;width:58px;height:58px;border:2px solid var(--gold);border-radius:6px;background:#d9cba6;box-shadow:inset 0 0 12px rgba(80,50,20,.55),0 3px 0 var(--ink);
  display:grid;place-items:center;font-size:36px;line-height:1}
.card.got span{opacity:.45}
.card.got::after{content:"";position:absolute;inset:2px;border:4px solid var(--stripe);border-radius:50%;animation:ring .45s ease-out}
.mbtns{display:flex;gap:8px;flex-wrap:wrap}

/* Painted item art */
img.ic{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none;user-select:none}
.cell .e{width:92%;height:92%}
.cell .e .ic{width:100%;height:100%}
.need .ic{width:40px;height:40px}
.info .big .ic,.disc .big .ic{width:56px;height:56px;margin:0 auto}
.dexitem .ic{width:100%;max-width:46px;height:auto;aspect-ratio:1;margin:0 auto}
.dex h3 .ic{display:inline-block;width:28px;height:28px;vertical-align:middle;margin-right:4px}
.how li > span .ic{width:32px;height:32px;margin:0 auto}
.muted .ic,.rewards .ic,.info p .ic{display:inline-block;width:1.6em;height:1.6em;vertical-align:middle}
img.ic.mult{mix-blend-mode:multiply;background:#e9dcbf;border-radius:6px}
.ghost .ic{width:100%;height:100%}

/* Hidden-object scene */
.sview{grid-area:board;position:relative;min-width:0;min-height:0;overflow:hidden;border:2px solid var(--line);border-radius:16px;background:#050b0d;
  touch-action:none;box-shadow:0 5px 0 var(--ink)}
.sview::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px rgba(0,0,0,.55);border-radius:14px}
.slayer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;--inv:1}
.slayer.glide{transition:transform .45s ease}
.slayer canvas{display:block}
.mark{position:absolute;transform:translate(-50%,-50%);border:calc(5px * var(--inv)) solid var(--stripe);border-radius:50%;pointer-events:none;
  box-shadow:0 0 0 calc(2px * var(--inv)) rgba(255,255,255,.7);animation:markring .45s ease-out}
@keyframes markring{0%{transform:translate(-50%,-50%) scale(1.8);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.miss{position:absolute;transform:translate(-50%,-50%);color:var(--stripe);font-weight:700;pointer-events:none;font-size:calc(34px * var(--inv));
  text-shadow:0 0 4px #fff;animation:missfade .7s forwards}
.hintring{position:absolute;transform:translate(-50%,-50%);border:calc(5px * var(--inv)) dashed var(--glow);border-radius:50%;pointer-events:none;
  box-shadow:0 0 30px var(--glow),inset 0 0 30px rgba(114,224,178,.4);animation:scope 3.4s ease-out forwards}
.float.sfloat{font-size:calc(20px * var(--inv))}
.zoombar{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoombar .btn{width:44px;height:44px;padding:0;font-size:22px}
.ptip{position:absolute;left:10px;bottom:10px;margin:0;font-size:12px;background:rgba(3,9,11,.75);padding:5px 12px;border-radius:999px;pointer-events:none;z-index:2}
.sload{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;letter-spacing:.1em;background:rgba(5,11,13,.88);z-index:3}
/* Wanted cards: big picture swatches in one row that scrolls sideways (a grid in the landscape rail) */
.finds{display:flex;flex-wrap:nowrap;gap:8px;flex:1 1 100%;min-width:0;overflow-x:auto;overflow-y:hidden;padding:2px 2px 6px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain}
.find{position:relative;flex:none;width:100px;scroll-snap-align:start;
  background:#d9cba6;border:2px solid var(--gold);border-radius:10px;padding:4px;box-shadow:inset 0 0 8px rgba(80,50,20,.4)}
.find img{display:block;width:100%;height:auto;aspect-ratio:1;border-radius:6px;mix-blend-mode:multiply}
.find .nm{display:block;margin-top:3px;color:#2b2118;font-size:12px;font-weight:700;line-height:1.3;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.find.got{opacity:.45}
.find.got .nm{text-decoration:line-through;text-decoration-color:var(--stripe);text-decoration-thickness:2px}
.find.all{border-color:var(--stripe);box-shadow:inset 0 0 8px rgba(80,50,20,.4),0 0 0 2px rgba(170,62,58,.35)}
.find .cnt{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:var(--stripe);color:#fff;font-size:13px;font-weight:800;
  border-radius:999px;padding:1px 9px;white-space:nowrap;box-shadow:0 1px 0 rgba(0,0,0,.4)}
.find.all::before{content:'全部';position:absolute;left:6px;top:6px;background:var(--stripe);color:#fff;font-size:11px;font-weight:800;border-radius:5px;padding:0 5px;z-index:1}
.find.got::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-size:54px;font-weight:800;color:var(--stripe);text-shadow:0 2px 0 #fff}
@keyframes missfade{0%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}

/* Discovery banner, toast */
.disc{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:65;display:flex;align-items:center;gap:12px;
  background:var(--paper);border:2px solid var(--gold);border-radius:16px;padding:10px 18px;box-shadow:0 0 24px rgba(201,163,74,.4),0 4px 0 var(--ink);
  animation:drop .4s cubic-bezier(.3,1.5,.5,1);pointer-events:none;max-width:calc(100% - 32px)}
.disc .big{font-size:42px;line-height:1}
.disc small{display:block;font-size:12px;color:var(--gold);letter-spacing:.12em;font-weight:700}
.disc b{font-family:var(--f-display);font-size:19px}
.disc em{font-style:normal;color:var(--gold);font-weight:700;margin-left:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bone);
  border:1px solid var(--line);font-weight:700;padding:10px 18px;border-radius:999px;font-size:15px;max-width:calc(100% - 32px);text-align:center}

/* Overlay */
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--veil);touch-action:manipulation;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;background:var(--paper);border:2px solid var(--line);border-radius:20px;
  box-shadow:0 6px 0 var(--ink),0 0 60px rgba(114,224,178,.15);padding:28px 24px 22px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;touch-action:pan-y}
.panel h1,.panel h2{font-family:var(--f-display);font-weight:800;margin:0;color:var(--glow);letter-spacing:.08em;text-shadow:0 0 14px rgba(114,224,178,.5),3px 3px 0 var(--ink);
  text-wrap:balance;line-height:1.2}
.panel h1{font-size:clamp(32px,7vw,46px)}
.panel h2{font-size:clamp(24px,5.5vw,34px)}
.panel p{margin:0;line-height:1.75;max-width:34em}
.kicker{font-size:13px;letter-spacing:.2em;color:var(--gold);font-weight:700}
.lore{font-family:var(--f-display);font-size:16px}
.how{list-style:none;margin:0;padding:0;display:grid;gap:8px;text-align:left;width:100%}
.how li{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;line-height:1.6;font-size:15px}
.how li > span{font-size:24px;line-height:1.2;text-align:center}
.rewards{list-style:none;margin:0;padding:12px 16px;display:grid;gap:6px;width:100%;background:var(--panel2);border:1px solid var(--gold);border-radius:12px;text-align:left;font-weight:700}
.dex{display:grid;gap:12px;width:100%;text-align:left}
.dex h3{margin:0 0 6px;font-size:14px;letter-spacing:.06em}
.dexrow{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.dexitem{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:28px;line-height:1.1}
.dexitem small{display:block;font-size:10px;margin-top:4px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dexitem.unknown{color:#4d6a64;font-family:var(--f-display)}
.dex h3 small{font-weight:500;font-size:11px;letter-spacing:0;margin-left:6px}
.relics{display:grid;gap:6px}
.relic{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--gold);border-radius:10px;padding:6px 10px}
.relic .ic{width:44px;height:44px;flex:none;filter:drop-shadow(0 0 8px rgba(232,196,104,.8))}
.relic b{display:block;font-size:13px;color:var(--gold)}
.relic small{display:block;font-size:11px;opacity:.85;line-height:1.5}
.relic.unknown{border-color:var(--line)}
.relic.unknown span{width:44px;text-align:center;font-family:var(--f-display);font-size:26px;color:#4d6a64}
.relic.unknown b{color:#4d6a64}
.relic-art .ic{width:120px;height:120px;filter:drop-shadow(0 0 22px rgba(232,196,104,.9));animation:beckon 2.2s ease-in-out infinite}

/* Header: painted icons, counters as engraved brass plates, buttons as old bronze plaques */
img.uic{display:inline-block;width:26px;height:26px;object-fit:contain;vertical-align:middle;flex:none;pointer-events:none;-webkit-user-drag:none;user-select:none;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}
.prog img.uic{width:28px;height:28px;margin-right:-4px;filter:drop-shadow(0 0 6px rgba(114,224,178,.45))}
.top .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 12px 2px 4px;border-radius:999px;color:#f1dfae;font-size:15px;
  background:linear-gradient(180deg,#3a2f1c,#1d170d);border:1px solid #8a6d2a;box-shadow:inset 0 1px 0 rgba(255,230,170,.25),inset 0 -2px 4px rgba(0,0,0,.6),0 2px 0 var(--ink)}
.top .pill img.uic{width:30px;height:30px}
.btn.hb{gap:5px;padding:4px 12px 4px 6px;color:#f1dfae;font-family:var(--f-display);letter-spacing:.06em;border-radius:10px;
  background:linear-gradient(180deg,#46391f 0%,#2a2113 55%,#1b150c 100%);border:1px solid #9a7b35;
  box-shadow:inset 0 1px 0 rgba(255,230,170,.3),inset 0 -2px 5px rgba(0,0,0,.55),0 3px 0 var(--ink);text-shadow:0 1px 0 #000}
.btn.hb img.uic{width:28px;height:28px}
.btn.hb:active{box-shadow:inset 0 2px 5px rgba(0,0,0,.6),0 0 0 var(--ink)}
.btn.hb.snd{padding:4px 6px}
.btn.hb.snd.off img.uic{filter:grayscale(1) brightness(.5)}
.btn.hb.snd.off::after{content:"";position:absolute;left:18%;right:18%;top:50%;height:2px;background:var(--stripe);transform:rotate(-40deg);border-radius:2px;box-shadow:0 0 0 1px #000}
.btn.hb.snd{position:relative}
#eyeBtn img.uic{width:26px;height:26px}

/* Spot the difference */
.dpanes{grid-area:board;position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;gap:10px;touch-action:manipulation}
.dpanes.stack{flex-direction:column}
.dpane{position:relative;flex:none}
.dpane canvas{display:block;border:2px solid var(--line);border-radius:12px;box-shadow:0 4px 0 var(--ink),0 0 30px rgba(0,0,0,.5);cursor:crosshair}
.dpane[data-p="0"] canvas{filter:sepia(.18) brightness(.95)}
.dlab{position:absolute;left:10px;top:8px;font-size:12px;font-weight:700;letter-spacing:.1em;padding:2px 10px;border-radius:999px;background:rgba(3,9,11,.75);pointer-events:none}
.dmark{position:absolute;transform:translate(-50%,-50%);border:4px solid var(--stripe);border-radius:50%;pointer-events:none;box-shadow:0 0 0 2px rgba(255,255,255,.75),0 0 12px rgba(192,53,61,.6)}
.dmark.fresh{animation:markring .45s ease-out}
.dmark.hint{border:3px dashed var(--glow);box-shadow:0 0 24px var(--glow);animation:scope 3.4s ease-out forwards}
.dmiss{position:absolute;transform:translate(-50%,-50%);color:var(--stripe);font-weight:800;font-size:34px;text-shadow:0 0 4px #fff;pointer-events:none;animation:missfade .7s forwards}
#dEye img.uic{width:26px;height:26px}

/* Ending */
.ending{position:fixed;inset:0;z-index:70;overflow:hidden;background:#000;color:#f1e6c8}
.ending[hidden]{display:none}
.ebg{position:absolute;inset:-4%;background:url(assets/bg-ending.jpg) 40% 50%/cover no-repeat;animation:edawn 60s ease-out forwards}
@keyframes edawn{from{transform:scale(1.12);filter:brightness(.35) saturate(.7)}to{transform:scale(1);filter:brightness(1) saturate(1)}}
.eshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 40%,rgba(0,0,0,.75))}
.etext{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:center;padding:0 24px;min-height:40%;align-items:flex-end;cursor:pointer}
.eline{max-width:30em;margin:0;font-family:var(--f-display);font-size:clamp(17px,2.6vw,22px);line-height:2;text-align:center;text-shadow:0 2px 6px #000,0 0 20px rgba(0,0,0,.8);
  animation:efade 6.5s ease-in-out forwards}
@keyframes efade{0%{opacity:0;transform:translateY(10px)}15%{opacity:1;transform:none}85%{opacity:1}100%{opacity:.15}}
.ending.roll .eshade{background:rgba(0,0,0,.55)}
.eroll{position:absolute;inset:0;overflow:hidden;pointer-events:none}   /* the credits only scroll; taps go to the text layer under it */
.rollin{position:absolute;left:0;right:0;top:100%;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:0 20px;
  animation:eroll 42s linear forwards}
@keyframes eroll{to{top:0;transform:translateY(calc(-100% + 92vh))}}
.rollin h1{font-family:var(--f-display);font-size:clamp(34px,6vw,56px);color:#cfeee2;letter-spacing:.12em;margin:0;text-shadow:0 0 22px rgba(114,224,178,.6)}
.rollin .rsub{opacity:.8;letter-spacing:.2em;margin:0 0 30px}
.rollin h3{margin:26px 0 4px;font-size:13px;letter-spacing:.3em;color:var(--gold)}
.rollin p{margin:0;font-family:var(--f-display);font-size:17px;text-shadow:0 1px 4px #000}
.rollin .thanks{margin-top:60px;font-size:20px;letter-spacing:.2em;color:#cfeee2}
.rollin .fin{margin:40px 0 10px;font-size:26px;letter-spacing:.4em}
.rollin .after{font-size:13px;opacity:.85;margin-bottom:14px}
/* Epilogue: the dawn picture drains away to a dim room-dark screen */
.ending.wake .ebg{animation:none;transition:filter 4s ease,opacity 4s ease;filter:brightness(.12) saturate(.2) blur(3px);opacity:.6}
.ending.wake .eshade{background:radial-gradient(ellipse at 50% 45%,rgba(20,30,28,.2),rgba(0,0,0,.9) 75%)}
.ending.wake .etext{inset:0;min-height:0;bottom:auto;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:24px}
.wline{margin:0;max-width:28em;text-align:center;font-family:var(--f-display);font-size:clamp(15px,2.3vw,19px);line-height:1.9;color:#d9d2bf;opacity:0;
  animation:wfade 2.4s ease forwards;text-shadow:0 1px 4px #000}
@keyframes wfade{to{opacity:1}}
.wline.whisper{margin-top:22px;color:#8fd9bd;letter-spacing:.18em;font-size:clamp(13px,1.9vw,16px);animation:whisper 5s ease forwards;filter:blur(.3px)}
@keyframes whisper{0%{opacity:0;letter-spacing:.5em;filter:blur(4px)}35%{opacity:.95;letter-spacing:.18em;filter:blur(0)}70%{opacity:.9}100%{opacity:.6;filter:blur(.8px)}}
.wbtn{margin-top:26px;animation:wfade 2s ease forwards;opacity:0}
.ending.wake .after{margin:18px 0 0;font-size:13px;opacity:.75}
.eskip{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));opacity:.7}
.htabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.htabs .btn.on{background:var(--gold);color:var(--ink);border-color:#e3c77a}
.gimline{font-size:13px}
.btn.hb.glow{animation:dglow 1.8s ease-in-out infinite}
@keyframes dglow{0%,100%{box-shadow:inset 0 1px 0 rgba(255,230,170,.3),0 3px 0 var(--ink),0 0 0 rgba(232,90,80,0)}50%{box-shadow:inset 0 1px 0 rgba(255,230,170,.3),0 3px 0 var(--ink),0 0 16px rgba(232,90,80,.85)}}
.dmoon .ic{width:90px;height:90px;margin:0 auto;filter:drop-shadow(0 0 18px rgba(232,90,80,.6))}

/* Title screen */
.title{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#050b0d;
  transition:opacity .6s ease;touch-action:manipulation}
.title.gone{opacity:0;pointer-events:none}
.title[hidden]{display:none}
.tbg{position:absolute;inset:-3%;background:url(assets/bg-title.jpg) 62% 50%/cover no-repeat;animation:tdrift 28s ease-in-out infinite alternate;filter:saturate(.9)}
.tbg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(5,11,13,.15),rgba(5,11,13,.55) 60%,rgba(5,11,13,.9) 100%),
  linear-gradient(180deg,rgba(5,11,13,.35),transparent 30%,transparent 60%,rgba(5,11,13,.85))}
.tfog{position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:radial-gradient(ellipse 60% 18% at 20% 75%,rgba(190,215,205,.35),transparent 70%),radial-gradient(ellipse 50% 14% at 80% 82%,rgba(170,200,190,.3),transparent 70%);
  animation:tfog 14s ease-in-out infinite alternate}
@keyframes tdrift{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.1) translate(-1.5%,-1%)}}
@keyframes tfog{from{transform:translateX(-4%)}to{transform:translateX(5%)}}
.tin{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px;text-align:center;margin-top:-6vh}
.tkick{margin:0;font-size:13px;letter-spacing:.3em;color:var(--gold);text-shadow:0 1px 3px #000}
.tname{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(46px,9vw,92px);line-height:1.1;letter-spacing:.12em;color:#cfeee2;
  text-shadow:0 0 18px rgba(114,224,178,.65),0 0 46px rgba(114,224,178,.35),4px 4px 0 #000;animation:tglow 4s ease-in-out infinite}
@keyframes tglow{0%,100%{text-shadow:0 0 18px rgba(114,224,178,.55),0 0 46px rgba(114,224,178,.25),4px 4px 0 #000}50%{text-shadow:0 0 26px rgba(114,224,178,.85),0 0 70px rgba(114,224,178,.45),4px 4px 0 #000}}
.tsub{margin:0 0 18px;font-family:var(--f-display);font-size:14px;letter-spacing:.2em;opacity:.8;text-shadow:0 1px 3px #000}
.tbtns{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(340px,86vw)}
.tbtns .tgo{width:100%;flex-direction:column;gap:2px;font-size:22px;padding:14px 20px;animation:beckon 2.6s ease-in-out infinite}
.tbtns .tgo small{font-family:var(--f-body);font-size:12px;letter-spacing:.05em;opacity:.9}
.tbtns .tb{width:100%;color:#f1dfae;font-family:var(--f-display);letter-spacing:.08em;background:linear-gradient(180deg,#46391f,#2a2113 55%,#1b150c);border:1px solid #9a7b35;
  box-shadow:inset 0 1px 0 rgba(255,230,170,.3),inset 0 -2px 5px rgba(0,0,0,.55),0 3px 0 var(--ink)}
.tbtns .tb.danger{background:#5a1a1e;border-color:var(--stripe);font-size:13px}
.trow{display:flex;gap:10px;width:100%}
.trow .tb{flex:1}
.trow .tb.snd.off img.uic{filter:grayscale(1) brightness(.5)}
.tfoot{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin:0;font-size:11px;opacity:.55}

/* Achievements */
.page.ach .rew{font-size:12px}
.page.ach.done{border-color:var(--gold);background:linear-gradient(90deg,rgba(201,163,74,.18),var(--panel2) 70%)}
.page.ach.done b{color:var(--gold)}
.abar{display:block;height:5px;margin-top:4px;border-radius:999px;background:#071012;overflow:hidden}
.abar i{display:block;height:100%;background:linear-gradient(90deg,#8a6d2a,var(--gold))}
img.uic.ach{width:48px;height:48px}

/* Client portraits */
img.face{display:block;flex:none;width:38px;height:38px;object-fit:cover;object-position:50% 20%;border-radius:50%;background:radial-gradient(circle at 50% 35%,#8fa69e,#3a5552 60%,#1c2e30);
  border:2px solid var(--line);pointer-events:none;-webkit-user-drag:none;user-select:none}
.order.boss img.face{border-color:#a07cc8}
.npc .whot{display:flex;flex-direction:column;min-width:0;flex:1}
.npc .say{font-size:11px;line-height:1.35;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-display)}
.portrait img.face{width:120px;height:120px;border-width:3px;margin:0 auto;box-shadow:0 0 24px rgba(114,224,178,.25)}
.info .big img.face{width:60px;height:60px;margin:0 auto}
.disc img.face{width:56px;height:56px}
.disc b.thx{font-size:16px;display:block;max-width:22em}
.page img.face{width:44px;height:44px}
/* The dealer's shop */
.goods{display:grid;gap:6px;width:100%;text-align:left}
.good{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.good > div{flex:1;min-width:0}
.good b{display:block;font-size:14px}
.good small{display:block;font-size:11px;opacity:.85;line-height:1.5}
.gart{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:26px}
.gart .ic{width:40px;height:40px}
/* Mythos notes */
.lorebox{position:sticky;top:-28px;z-index:2;width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel2);border:1px solid var(--gold);
  border-radius:12px;padding:10px 12px;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.lorebox > small{opacity:.8}
.lorebox .lart{width:64px;height:64px;flex:none}
.lorebox .lart .ic{width:64px;height:64px}
.lorebox b{display:block;font-family:var(--f-display);font-size:16px;color:var(--gold)}
.lorebox b small{font-family:var(--f-body);font-size:11px;color:var(--bone);opacity:.7;margin-left:6px}
.lorebox p{margin:4px 0 0;font-size:13px;line-height:1.65}
.lorebox p.flav{opacity:.75;font-style:italic}
button.dexitem{font:inherit;color:inherit;cursor:pointer;width:100%}
.dexitem.on{border-color:var(--gold);box-shadow:0 0 10px rgba(232,196,104,.5)}
details.myth{display:block;text-align:left}
details.myth summary{cursor:pointer;list-style:none}
details.myth summary b{display:inline}
details.myth summary::-webkit-details-marker{display:none}
details.myth summary::before{content:'▸ ';color:var(--gold)}
details.myth[open] summary::before{content:'▾ '}
details.myth p{margin:6px 0 2px;font-size:12px;line-height:1.7}

/* Chapter twists on the board */
.fog{width:96%;height:96%;border-radius:30%;background:radial-gradient(circle at 30% 40%,rgba(200,220,215,.85),transparent 55%),radial-gradient(circle at 70% 60%,rgba(170,195,190,.8),transparent 55%),
  radial-gradient(circle at 50% 50%,rgba(120,150,150,.75),rgba(60,85,90,.6) 70%);filter:blur(1.5px);animation:drift 6s ease-in-out infinite}
.info .big .fog{width:52px;height:52px;margin:0 auto}
.fog.mini{display:block;width:30px;height:30px;margin:0 auto}
@keyframes drift{0%,100%{transform:translateX(-3%) scale(1)}50%{transform:translateX(3%) scale(1.04)}}
.cell .stone .e,.info .big.stone .ic{filter:grayscale(1) brightness(.75) contrast(1.2) drop-shadow(0 0 2px #000)}
.cell .stone::after{content:"";position:absolute;inset:10%;border-radius:20%;background:repeating-linear-gradient(35deg,transparent 0 9px,rgba(0,0,0,.35) 9px 11px);pointer-events:none}
.stone-ic{display:block;font-style:normal;font-family:var(--f-display);font-size:18px;color:#aab;background:#3a4044;border-radius:8px;width:30px;margin:0 auto}
.cell .tent .asks{position:absolute;right:2%;top:2%;width:42%;height:42%;background:var(--paper);border:2px solid var(--stripe);border-radius:50%;padding:2px;display:grid;place-items:center}
.cell .tent .asks .ic{width:100%;height:100%}
.cell .tent .e{animation:sway 3s ease-in-out infinite}
.cell .gift::before{border-color:rgba(232,196,104,.6);background:radial-gradient(circle,rgba(232,196,104,.25),transparent 70%)}
.cell .vault::before{border-color:rgba(160,120,200,.55);background:radial-gradient(circle,rgba(160,120,200,.22),transparent 70%);animation:none}
.info .dz.hint{border-style:solid;opacity:.85}
.info .dz.hint .ic{width:40px;height:40px}
/* Climax request */
.order.boss{border-color:#a07cc8;background:linear-gradient(160deg,#211830,var(--paper) 65%)}
.order.boss.ready{box-shadow:0 3px 0 var(--ink),0 0 18px rgba(160,124,200,.7)}
.boss-tag{background:#7a55a8}
.boss-needs{display:flex;gap:14px;justify-content:center}
.boss-needs > div{width:110px;background:var(--panel2);border:1px solid #a07cc8;border-radius:12px;padding:8px}
.boss-needs .ic{width:80px;height:80px;margin:0 auto}
.boss-needs small{display:block;font-size:12px;margin-top:4px;line-height:1.4}
/* Sanity and ratings */
.san{display:inline-block;margin-left:10px;font-family:var(--f-body);font-size:13px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);vertical-align:middle;color:var(--gold)}
.san.r2{color:#e0b060}
.san.r1{color:#ff8a8f;border-color:var(--stripe)}
.sview.shaken::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 90px rgba(150,20,40,.55);animation:breathe 2.4s ease-in-out infinite}
.find.blur:not(.got) img{filter:blur(6px) grayscale(.5)}
.find.blur::before{content:'おぼろ';position:absolute;left:6px;top:6px;background:#5a4a7a;color:#fff;font-size:11px;font-weight:800;border-radius:5px;padding:0 5px;z-index:1}
.rating{font-size:40px;letter-spacing:.12em;color:var(--gold);text-shadow:0 0 16px rgba(232,196,104,.6);line-height:1}
.rating.r1{color:#c99}
.title-up{background:linear-gradient(90deg,transparent,rgba(232,196,104,.2),transparent);padding:6px 16px;border-radius:10px}
.title-up b{color:var(--gold);font-family:var(--f-display);font-size:18px}
/* Investigation log */
.panel h2.sub{font-size:clamp(20px,4.5vw,26px)}
.pages{display:grid;gap:6px}
.page{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.page > div{flex:1;min-width:0}
.page b{display:block;font-size:13px}
.page small{display:block;font-size:11px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page.now{border-style:dashed;opacity:.7}
.pstars{color:var(--gold);font-size:16px;white-space:nowrap}
.page small.desc{white-space:normal;line-height:1.5}
.pch{font-style:normal;font-weight:500;font-size:10px;color:#c9a8ee;margin-left:8px}
.npc[data-who]{cursor:pointer}
.npc .who{font-style:normal;display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--line);font-size:10px;margin-left:2px;vertical-align:1px;opacity:.8}
.pstars.r0{color:#4d6a64}

function layoutHidden(s, th) {
  const H = HIDDEN[th.hs], R = mulberry(s.seed);
  const k = Math.max(SW / H.w, SH / H.h), ox = (SW - H.w * k) / 2, oy = (SH - H.h * k) / 2;
  let pool = H.items.slice();
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  // Later searches of a chapter look in the same picture for other things: items already asked for go to the back.
  const ex = s.ex || [];
  pool = pool.filter(it => !ex.includes(it.id)).concat(pool.filter(it => ex.includes(it.id)));
  const chosen = pool.slice(0, Math.min(findCount(s.ch), pool.length));
  // One "find them all" item: something the picture holds several of; every copy must be found.
  const many0 = pool.filter(it => it.at.length >= 3), fresh = many0.filter(it => !ex.includes(it.id)), many = fresh.length ? fresh : many0;
  const all = many.length ? many[Math.floor(R() * many.length)] : null;
  if (all && !chosen.includes(all)) chosen[chosen.length - 1] = all;
  const T = chosen.map((it, n) => {
    const at = it.at.map(([x, y, r]) => ({ x: x * k + ox, y: y * k + oy, s: r * k / .55, src: [x, y, r] }));
    return Object.assign({ t: n, e: it.id, ja: it.ja, at, all: it === all }, at[0]);
  });
  return { seed: s.seed, th, items: [], T, hidden: true };
}

function floater(board, cols, i, text, cls = '') {
  const { x, y } = cellCenter(board, cols, i);
  const f = document.createElement('div');
  f.className = 'float ' + cls;
  f.textContent = text;
  f.style.left = x + 'px'; f.style.top = y + 'px';
  board.appendChild(f);
  setTimeout(() => f.remove(), 1200);
}
function burst(board, cols, i, t) {
  const { x, y, size } = cellCenter(board, cols, i);
  const n = 6 + t * 2;
  for (let k = 0; k < n; k++) {
    const s = document.createElement('span');
    s.className = 'spark' + (t >= 3 && k % 2 ? ' gold' : '');
    const a = k / n * Math.PI * 2, d = size * (.55 + Math.random() * .45 + t * .08);
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.setProperty('--dx', Math.cos(a) * d + 'px');
    s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    board.appendChild(s);
    setTimeout(() => s.remove(), 700);
  }
}
let toastTimer = 0;
function toast(msg) {
  const t = $('toast');

  toastTimer = setTimeout(() => { t.hidden = true; }, 2400);

/* ================= merge board ================= */
function buildMerge() {
  const b = $('mboard');
  b.innerHTML = '';
  mEls = S.cells.map(() => { const d = document.createElement('div'); d.className = 'cell'; b.appendChild(d); return d; });
  fitAll();
  S.cells.forEach((_, i) => paintM(i));
}

function paintM(i, anim) {
  const el = mEls[i], c = S.cells[i];
  let html = '';
  if (c && c.k === 'item') html = `<div class="p t${c.t}"><span class="e">${ITEM(c.c, c.t)[0]}</span></div>`;
  else if (c && c.k === 'gen') html = `<div class="p gen"><span class="e">${CHAINS[c.g].gen.e}</span><b class="lv">Lv${c.lv}</b></div>`;
  else if (c && c.k === 'chest') html = `<div class="p gen"><span class="e">${CHEST}</span><b class="lv">×${c.n}</b></div>`;
  else if (c && c.k === 'lock') html = `<div class="p"><div class="seal"></div></div>`;
  else if (c && c.k === 'fog') html = `<div class="p"><div class="fog"></div></div>`;
  else if (c && c.k === 'stone') html = `<div class="p stone"><span class="e">${ITEM(c.c, c.t)[0]}</span></div>`;
  else if (c && c.k === 'tent') html = `<div class="p tent"><span class="e">${TENT}</span><span class="asks">${ITEM(c.need.c, c.need.t)[0]}</span></div>`;
  else if (c && c.k === 'gift') html = `<div class="p gen gift"><span class="e">${GIFT}</span><b class="lv">×${c.in.length}</b></div>`;
  else if (c && c.k === 'vault') html = `<div class="p gen vault"><span class="e">${VAULT}</span><b class="lv">${(S.store || []).length}/${storeCap()}</b></div>`;
  if (anim === 'puff') html += '<span class="dust"></span>';
  el.innerHTML = html;
  el.className = 'cell' + (sel === i ? ' sel' : '') + (wantSet.has(i) ? ' want' : '') + (anim && anim !== 'puff' ? ' ' + anim : '') + (anim === 'puff' && c ? ' pop' : '');
}

function select(i) {
  const prev = sel;
  sel = i; sellArm = false;
  if (prev >= 0 && mEls[prev]) mEls[prev].classList.remove('sel');
  if (i >= 0) mEls[i].classList.add('sel');
  renderInfo();
}

  if (!c) {
    box.innerHTML = `<div class="big">🗝️</div><div class="txt"><b>調査メモ</b><p>光る輪の<b>道具</b>をタップすると素材が出る。同じものを重ねると合体し、依頼の品に近づく。</p></div>`;

    box.innerHTML = `<div class="big">${it[0]}</div><div class="txt"><b>${it[1]}<small>Lv${c.t + 1}</small></b><p>${it[2]}</p><p class="muted">2つ重ねると → ${next}</p></div>
      <div class="acts"><button class="btn tiny" data-act="stash" type="button" ${storeFull() ? 'disabled' : ''}>櫃にしまう</button>
        <button class="btn tiny${sellArm ? ' danger' : ''}" data-act="sell" type="button">${sellArm ? '本当に還す？' : '深淵へ還す'} 🪙${SELL[c.t]}</button></div>`;
  } else if (c.k === 'gen') {
    const g = CHAINS[c.g].gen, odds = GEN_LV[c.lv];

    const up = c.lv < 5 ? `<button class="btn tiny gold" data-act="upgrade" type="button" ${S.coins < GEN_COST[c.lv + 1] ? 'disabled' : ''}>強化 🪙${GEN_COST[c.lv + 1]}</button>` : '<span class="muted">最大まで強化ずみ</span>';
    box.innerHTML = `<div class="big">${g.e}</div><div class="txt"><b>${g.n}<small>Lv${c.lv}</small></b><p>タップで「${CHAINS[c.g].name}」の素材が出る。強化すると、はじめから上の段階が出やすくなる。</p><p class="muted">${oddsText}</p></div>
      <div class="acts">${up}</div>`;

      <div class="acts"><button class="btn tiny" data-act="stash" type="button" ${storeFull() ? 'disabled' : ''}>櫃にしまう</button></div>`;
  } else if (c.k === 'gift') {
    box.innerHTML = `<div class="big">${GIFT}</div><div class="txt"><b>贈りもの<small>中身 ${c.in.length}つ</small></b><p>タップするたびに中身がひとつ出る。贈りものどうしを重ねると、ひとつにまとまって<b>おまけの品</b>が増える。</p></div>`;
  } else if (c.k === 'vault') {
    box.innerHTML = `<div class="big">${VAULT}</div><div class="txt"><b>封印の櫃<small>${(S.store || []).length} / ${storeCap()}</small></b><p>品や宝箱をドラッグして重ねると、しまっておける。タップで中を見て、出したり広げたりできる。</p></div>`;
  } else if (c.k === 'fog' || c.k === 'stone' || c.k === 'tent') {
    const G = GIMMICKS[c.k];
    const art = c.k === 'fog' ? '<div class="fog"></div>' : c.k === 'stone' ? ITEM(c.c, c.t)[0] : TENT;
    const need = c.k === 'stone' ? `<p class="muted">重ねる品：${ITEM(c.c, c.t)[0]} ${ITEM(c.c, c.t)[1]}</p>` : c.k === 'tent' ? `<p class="muted">求める品：${ITEM(c.need.c, c.need.t)[0]} ${ITEM(c.need.c, c.need.t)[1]}</p>` : '';
    box.innerHTML = `<div class="big${c.k === 'stone' ? ' stone' : ''}">${art}</div><div class="txt"><b>${G.n}<small>この章のしかけ</small></b><p>${G.d}</p>${need}</div>`;
  } else {
    box.innerHTML = `<div class="big">✴</div><div class="txt"><b>封印されたマス</b><p>現場検証を解決するたびに、封印が一列ずつ解ける。</p></div>`;
  }
}

$('info').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || sel < 0) return;
  const c = S.cells[sel];
  if (b.dataset.act === 'sell' && c && c.k === 'item') {
    if (!sellArm) { sellArm = true; renderInfo(); return; }
    toAbyss(sel);
  } else if (b.dataset.act === 'stash' && c) {
    stash(sel);
  } else if (b.dataset.act === 'upgrade' && c && c.k === 'gen' && c.lv < 5 && S.coins >= GEN_COST[c.lv + 1]) {
    S.coins -= GEN_COST[c.lv + 1];
    c.lv++;
    paintM(sel, 'pop');
    burst($('mboard'), COLS, sel, 4);
    sfx.discover();
    toast(`${CHAINS[c.g].gen.n}が Lv${c.lv} になった`);
    renderInfo();
    afterChange();
  }
});

function discover(c, t) {
  const k = key(c, t);
  if (S.dex[k]) return;
  S.dex[k] = true;
  const bonus = 5 * (t + 1) ** 2;
  S.coins += bonus;
  showDiscovery(ITEM(c, t), bonus);
  setTimeout(sfx.discover, 120);
}

function emptyCellsNear(i) {
  const cx = i % COLS, cy = Math.floor(i / COLS);
  return S.cells.map((c, j) => c ? -1 : j).filter(j => j >= 0)
    .sort((a, b) => {
      const da = Math.max(Math.abs(a % COLS - cx), Math.abs(Math.floor(a / COLS) - cy)) * 10 + Math.abs(a % COLS - cx) + Math.abs(Math.floor(a / COLS) - cy);
      const db = Math.max(Math.abs(b % COLS - cx), Math.abs(Math.floor(b / COLS) - cy)) * 10 + Math.abs(b % COLS - cx) + Math.abs(Math.floor(b / COLS) - cy);
      return da - db;
    });
}

function produce(i) {
  const g = S.cells[i];
  const empties = emptyCellsNear(i);
  if (!empties.length) { toast('空きマスがない。合体させるか、売って場所をつくろう'); sfx.bump(); paintM(i, 'shake'); return; }
  const odds = GEN_LV[g.lv];
  let x = Math.random(), t = 0;
  while (t < 2 && x > odds[t]) { x -= odds[t]; t++; }
  if (Math.random() < .03 * relicLv(1)) t = Math.min(t + 1, 3);
  if (g.g === 0 && modOn('tide') && Math.random() < .2) t = Math.min(t + 1, 3);
  bumpTot('p', 1);
  const j = empties[0];
  S.cells[j] = { k: 'item', c: g.g, t };
  paintM(i, 'land');
  paintM(j, 'pop');
  sfx.spawn();
  discover(g.g, t);
  afterChange();
}

const sameItem = (a, b) => a && b && a.k === 'item' && b.k === 'item' && a.c === b.c && a.t === b.t;

function drop(a, b) {
  const C = S.cells;
  if (b < 0 || a === b) { paintM(a); return; }
  const s = C[a], d = C[b];
  const moveSel = () => { if (sel === a) sel = b; else if (sel === b) sel = a; };
  if (d && d.k === 'lock') { paintM(a); sfx.bump(); return; }
  if (d && d.k === 'vault' && (s.k === 'item' || s.k === 'chest' || s.k === 'gift')) { stash(a); paintM(b, 'land'); return; }
  if (d && d.k === 'gift' && s.k === 'gift') { mergeGifts(a, b); return; }
  if (d && (d.k === 'fog' || d.k === 'stone' || d.k === 'tent')) {
    if (!gimFits(s, d)) {
      paintM(a); paintM(b, 'shake'); sfx.bump();
      toast(d.k === 'fog' ? '霧の中には置けない。となりで合体すると晴れる' : d.k === 'stone' ? `同じ品（${ITEM(d.c, d.t)[1]}）を重ねると石がくだける` : `触手は「${ITEM(d.need.c, d.need.t)[1]}」を求めている`);
      return;
    }
    C[a] = null; sel = b;
    paintM(a);
    if (d.k === 'stone') {
      C[b] = { k: 'item', c: s.c, t: s.t + 1 };
      floater($('mboard'), COLS, b, '石がくだけた！', 'gold');
      sfx.merge(s.t + 1);
      discover(s.c, s.t + 1);
      if (s.t + 1 >= 4) bumpTot('hi', 1);
      countMerge();
    } else {
      const coins = (10 * 2 ** s.t + 30) * (modOn('fog') ? 2 : 1);
      S.coins += coins;
      C[b] = { k: 'chest', n: 2, lv: Math.min(MAXT, s.t + 1) };
      floater($('mboard'), COLS, b, `触手が帰っていく… 🪙+${coins}`, 'gold');
      sfx.abyss();
      setTimeout(sfx.coin, 300);
    }
    paintM(b, 'pop');
    burst($('mboard'), COLS, b, s.t + 2);
    gimSolved();
    afterChange(); renderInfo();
    return;
  }
  if (!d) {
    C[b] = s; C[a] = null; moveSel();
    paintM(a); paintM(b, 'land'); sfx.move();
    afterChange(); renderInfo();
    return;
  }
  if (sameItem(s, d)) {
    if (s.t >= MAXT) { makeRelic(a, b, s.c); return; }
    const group = cluster(b, a);
    const n = group.length + 1;
    C[a] = null;
    sel = b;
    paintM(a);
    if (n >= 5) {
      // Big merge: 5+ at once yields one extra piece (pairs would leave one over).
      const made = Math.floor(n / 2) + 1;
      group.forEach((j, k) => { C[j] = k < made ? { k: 'item', c: s.c, t: s.t + 1 } : null; });
      group.forEach((j, k) => paintM(j, k < made ? 'pop' : 'puff'));
      burst($('mboard'), COLS, b, s.t + 4);
      floater($('mboard'), COLS, b, `大合体！ ×${made}`, 'gold');
      sfx.merge(s.t + 2);
      setTimeout(sfx.coin, 150);
    } else {
      C[b] = { k: 'item', c: s.c, t: s.t + 1 };
      paintM(b, 'pop');
      burst($('mboard'), COLS, b, s.t + 1);
      sfx.merge(s.t + 1);
    }
    discover(s.c, s.t + 1);
    if (s.t + 1 >= 4) bumpTot('hi', n >= 5 ? Math.floor(n / 2) + 1 : 1);
    maybeChest(b, s.t + 1);
    countMerge();
    clearFog(n >= 5 ? group : [b]);
    afterChange(); renderInfo();
    return;
  }
  C[a] = d; C[b] = s; moveSel();
  paintM(a, 'land'); paintM(b, 'land'); sfx.move();
  afterChange(); renderInfo();
}

function makeRelic(a, b, c) {
  S.cells[a] = null; S.cells[b] = null; sel = -1;
  S.relics = S.relics || [0, 0, 0];
  const n = ++S.relics[c], r = RELICS[c];
  S.coins += RELIC_COINS;
  paintM(a); paintM(b, 'puff');
  burst($('mboard'), COLS, b, 9);
  floater($('mboard'), COLS, b, `${r.n}！`, 'gold');
  sfx.relic();
  // Only the first relic of a kind gets the full reveal; later ones just announce themselves, to keep the pace.
  if (n > 1) {
    toast(`${r.n} ×${n}${n > r.max ? '（効果はもう最大）' : '　力が強まった'}　🪙+${RELIC_COINS}`);
    renderInfo(); afterChange();
    return;
  }
  const lv = '';
  showOverlay(`
    <p class="kicker">古き秘宝</p>
    <div class="relic-art">${ITEM(c, MAXT)[0]}</div>
    <h2>${r.n}${n > 1 ? ` ×${n}` : ''}</h2>
    <p>${r.d}${lv}</p>
    <p class="muted">秘宝は盤面からはなれて、ずっと力をかしてくれる。🪙+${RELIC_COINS}</p>
    <button class="btn primary" type="button" data-go>受けとる</button>
  `, hideOverlay);
  renderInfo(); afterChange();
}

/* ---- chapter twists: fog, petrified items, tentacles ---- */
const isGim = c => c && (c.k === 'fog' || c.k === 'stone' || c.k === 'tent');
const gimFits = (s, d) => s && s.k === 'item' && (d.k === 'stone' ? s.c === d.c && s.t === d.t : d.k === 'tent' ? s.c === d.need.c && s.t === d.need.t : false);
function countMerge() { S.cs = S.cs || {}; S.cs.m = (S.cs.m || 0) + 1; bumpTot('m', 1); }
function clearFog(list) {
  list.forEach(i => {
    const x = i % COLS, y = Math.floor(i / COLS);
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
      const nx = x + dx, ny = y + dy, j = ny * COLS + nx;
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || !S.cells[j] || S.cells[j].k !== 'fog') return;
      const h = S.cells[j].hid;
      S.cells[j] = h;
      paintM(j, 'pop');
      floater($('mboard'), COLS, j, '霧が晴れた', 'gold');
      discover(h.c, h.t);
      gimSolved();
    });
  });
}
function gimSolved() {
  S.cs = S.cs || {}; S.cs.g = (S.cs.g || 0) + 1; bumpTot('g', 1);
  if (S.gimTotal && !S.cells.some(isGim)) {
    const bonus = (40 + 30 * S.ch) * (modOn('fog') ? 2 : 1);
    S.coins += bonus; S.gimTotal = 0;
    setTimeout(() => { sfx.discover(); toast(`この章のしかけをすべて解いた！ 🪙+${bonus}`); renderTop(); save(); }, 1200);
  }
}
function placeGimmicks() {
  S.gimCh = S.ch;
  S.gimTotal = 0;
  const kinds = gimmicksOf(S.ch);
  if (!kinds.length) return;
  const avail = [0, 1, 2].filter(g => S.gens[g]);
  const free = shuffle(S.cells.map((c, i) => c ? -1 : i).filter(i => i >= 0));
  const plan = kinds.flatMap(k => Array(k === 'fog' ? 3 : 2).fill(k)), room = free.length - 6;
  const tier = Math.min(2 + Math.floor(S.ch / 2), 5);
  plan.forEach((k, n) => {
    if (n >= room) return;
    const i = free[n];
    S.cells[i] = k === 'fog' ? { k: 'fog', hid: { k: 'item', c: pick(avail), t: Math.min(1 + Math.floor(S.ch / 2) + rnd(2), 5) } }
      : k === 'stone' ? { k: 'stone', c: pick(avail), t: tier } : { k: 'tent', need: { c: pick(avail), t: tier } };
    S.gimTotal++;
    if (mEls[i]) paintM(i, 'pop');
  });
}

/* ---- gifts: rewards arrive as a parcel on the board; tap to unpack, stack two for a bonus ---- */
function giveGift(list) {
  if (!list.length) return;
  const j = emptyCellsNear(3 * COLS + 3)[0];
  if (j === undefined) { S.inbox.push({ k: 'gift', in: list }); toast('盤面がいっぱい。贈りものは 🎁 に預けておいた'); return; }
  S.cells[j] = { k: 'gift', in: list };
  if (mEls[j]) { paintM(j, 'pop'); setTimeout(() => floater($('mboard'), COLS, j, '贈りもの！', 'gold'), 200); }
}
function openGift(i) {
  const c = S.cells[i];
  const x = c.in[0];
  if (c.in.length > 1) {
    const j = emptyCellsNear(i)[0];
    if (j === undefined) { toast('空きマスがない。場所をあけてから開けよう'); sfx.bump(); paintM(i, 'shake'); return; }
    c.in.shift();
    S.cells[j] = x;
    paintM(i, 'land'); paintM(j, 'pop');
  } else {
    S.cells[i] = x; sel = -1;
    paintM(i, 'pop');
  }
  burst($('mboard'), COLS, i, 3);
  sfx.spawn();
  if (x.k === 'item') discover(x.c, x.t);
  renderInfo();
  afterChange();
}
function mergeGifts(a, b) {
  const C = S.cells, all = C[b].in.concat(C[a].in);
  const avail = [0, 1, 2].filter(g => S.gens[g]);
  const t = Math.min(5, 1 + Math.floor(all.length / 2));
  all.push({ k: 'item', c: pick(avail), t });
  C[b] = { k: 'gift', in: all };
  C[a] = null; sel = b;
  paintM(a); paintM(b, 'pop');
  burst($('mboard'), COLS, b, 4);
  floater($('mboard'), COLS, b, `まとまった！ おまけ ${ITEM(all[all.length - 1].c, t)[1]}`, 'gold');
  sfx.merge(3);
  afterChange(); renderInfo();
}
// The sealed chest lives on the board as a piece of its own.
function ensureVault() {
  if (S.cells.some(c => c && c.k === 'vault')) return;
  const j = emptyCellsNear(0)[0];
  if (j !== undefined) S.cells[j] = { k: 'vault' };
}
function paintVault() { const j = S.cells.findIndex(c => c && c.k === 'vault'); if (j >= 0 && mEls[j]) paintM(j); }

// Orthogonally connected identical items starting at b (b first, nearest first), ignoring the dragged cell.
function cluster(b, skip) {
  const ref = S.cells[b], seen = new Set([b]), out = [b];
  for (let q = 0; q < out.length; q++) {
    const i = out[q], x = i % COLS, y = Math.floor(i / COLS);
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
      const nx = x + dx, ny = y + dy, j = ny * COLS + nx;
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || seen.has(j) || j === skip) return;
      seen.add(j);
      if (sameItem(ref, S.cells[j])) out.push(j);
    });
  }
  return out;
}

const CHEST_ODDS = [0, 0, 0, .2, .35, .5, .6, .7];
function maybeChest(i, t) {
  if (!CHEST_ODDS[t] || Math.random() >= CHEST_ODDS[t] + .05 * relicLv(2) + (modOn('moon') ? .15 : 0)) return;
  const chest = { k: 'chest', n: t, lv: t };
  const j = emptyCellsNear(i)[0];
  if (j === undefined) { S.inbox.push(chest); toast('宝箱が出た！ 🎁 に入れておいた'); }
  else { S.cells[j] = chest; paintM(j, 'pop'); }
  setTimeout(() => { sfx.discover(); floater($('mboard'), COLS, j === undefined ? i : j, '宝箱！', 'gold'); }, 250);
}

function openChest(i) {
  const c = S.cells[i];
  const avail = [0, 1, 2].filter(g => S.gens[g]);
  const t = Math.min(MAXT, rnd(2) + (c.lv - 3) + rnd(2));
  const item = { k: 'item', c: pick(avail), t: Math.max(0, t) };
  c.n--;
  bumpTot('c', 1);
  if (c.n <= 0) {
    S.cells[i] = item;
    sel = -1;
    paintM(i, 'pop');
  } else {
    const j = emptyCellsNear(i)[0];
    if (j === undefined) { c.n++; toast('空きマスがない。場所をあけてから開けよう'); sfx.bump(); paintM(i, 'shake'); return; }
    S.cells[j] = item;
    paintM(i, 'land');
    paintM(j, 'pop');
  }
  sfx.spawn();
  discover(item.c, item.t);
  renderInfo();
  afterChange();
}

function tapM(i) {
  const c = S.cells[i];
  if (c && c.k === 'gen') { select(i); produce(i); }
  else if (c && c.k === 'chest') { select(i); openChest(i); }
  else if (c && c.k === 'gift') { select(i); openGift(i); }
  else if (c && c.k === 'vault') { select(i); showStore(); }
  else if (c) select(i);
  else select(-1);
}

function afterChange() {
  checkAchs();
  paintVault();
  renderOrders();
  renderTop();
  save();
}

/* ================= orders ================= */
function itemIndex() {
  const m = {};
  S.cells.forEach((c, i) => { if (c && c.k === 'item') (m[key(c.c, c.t)] = m[key(c.c, c.t)] || []).push(i); });
  return m;
}

function renderOrders() {
  const idx = itemIndex();
  wantSet = new Set();
  const html = [S.boss, ...S.orders].filter(Boolean).map(o => {
    const used = {};
    let ready = true;
    const needs = o.need.map(n => {
      const k = key(n.c, n.t), have = (idx[k] || []).length - (used[k] || 0);
      used[k] = (used[k] || 0) + 1;
      const ok = have > 0;
      if (!ok) ready = false;
      (idx[k] || []).forEach(i => wantSet.add(i));
      return `<span class="need" title="${ITEM(n.c, n.t)[1]}">${ITEM(n.c, n.t)[0]}${ok ? '<i>✓</i>' : ''}</span>`;
    }).join('');
    return `<div class="order${ready ? ' ready' : ''}${o.sp ? ' special' : ''}${o.boss ? ' boss' : ''}" data-oid="${o.id}">
      <div class="npc" data-who="${o.npc.n}">${FACE(o.npc.n)}<div class="whot"><span class="nm">${o.npc.n}</span><span class="say">「${askOf(o)}」</span></div>${o.sp ? '<span class="sp-tag">特別</span>' : o.boss ? '<span class="sp-tag boss-tag">山場</span>' : ''}</div>
      <div class="needs">${needs}</div>
      <div class="foot"><span class="rew">🪙${orderCoins(o)}${o.stars ? ' ★' + o.stars : ''}${o.eyes ? ' 👁️' + o.eyes : ''}</span><button class="btn tiny gold" type="button" data-deliver="${o.id}" ${ready ? '' : 'disabled'}>納品</button></div>
    </div>`;
  }).join('');
  $('orders').innerHTML = html || '<div class="empty-orders">新しい依頼を待っている…</div>';
  mEls.forEach((el, i) => el.classList.toggle('want', wantSet.has(i)));
}

$('orders').addEventListener('click', e => {
  const b = e.target.closest('[data-deliver]');
  if (b && !b.disabled) { deliver(+b.dataset.deliver); return; }
  // Tapping a client's name shows who they are in the info panel.

    $('info').innerHTML = `<div class="big">${FACE(w.dataset.who)}</div><div class="txt"><b>${w.dataset.who}<small>依頼主</small></b><p>${whoIs(w.dataset.who)}</p></div>`;
  }
});

function deliver(id) {
  const o = S.boss && S.boss.id === id ? S.boss : S.orders.find(x => x.id === id);
  if (!o) return;
  const taken = [];
  for (const n of o.need) {
    const j = S.cells.findIndex((c, i) => !taken.includes(i) && c && c.k === 'item' && c.c === n.c && c.t === n.t);
    if (j < 0) return;
    taken.push(j);
  }
  taken.forEach(j => { S.cells[j] = null; if (sel === j) sel = -1; paintM(j, 'puff'); });
  const g = goal(S.ch), before = S.stars;
  const coins = orderCoins(o);
  S.coins += coins;
  S.stars += o.stars;
  if (o.eyes) S.eyes += o.eyes;
  S.orders = S.orders.filter(x => x.id !== id);
  S.cs = S.cs || {}; S.cs.o = (S.cs.o || 0) + 1; bumpTot('o', 1);
  sfx.coin();
  if (o.boss) {
    S.boss = null; S.bossDone = true;
    giveGift([{ k: 'chest', n: 3, lv: 4 + Math.min(2, Math.floor(S.ch / 2)) }]);
    showThanks(o.npc.n, thanksOf(o), `🪙+${coins} 👁️+${o.eyes} 宝箱`);
    setTimeout(() => { sfx.discover(); toast('道がひらけた。現場検証へ向かおう'); }, 1400);
  } else showThanks(o.npc.n, thanksOf(o), `🪙+${coins} ★+${o.stars}${o.eyes ? ` 👁️+${o.eyes}` : ""}`);
  renderInfo();
  afterChange();
  if (before < g && S.stars >= g) {
    if (!lastStage()) setTimeout(() => { sfx.discover(); toast(`手がかりがそろった。現場検証（${stageOf() + 1} / ${STAGES}）へ向かおう`); }, 1400);
    else if (!S.bossDone && !S.boss) { makeBoss(); renderOrders(); setTimeout(showBoss, 900); }
  }
  setTimeout(() => { fillOrders(); renderOrders(); save(); }, 900);
}

function showDropZones(c) {

function showStore() {

/* ================= the dealer's shop: things to spend coins on ================= */
const SHOP_LINES = ['いらっしゃい。どれも、ちょっと訳ありの品でね。', '値切りは聞かないよ。そのかわり、品は確かだ。', 'おや、また来たね。今日は珍しいのが入ってるよ。'];

function showShop(line) {

    else g.buy();

$('shopBtn').addEventListener('click', () => showShop());
$('dayBtn').addEventListener('click', showDaily);
// Coming back to the app on a new day starts that day's anomaly.
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !S) return;
  if (ensureDaily()) { renderTop(); save(); toast('新しい一日。町にまた異変が起きている（「今日」ボタン）'); }
});

function unlockRow() {
  const row = [...Array(ROWS).keys()].find(r => S.cells.slice(r * COLS, r * COLS + COLS).some(c => c && c.k === 'lock'));
  if (row === undefined) return false;
  for (let c = 0; c < COLS; c++) { const i = row * COLS + c; if (S.cells[i] && S.cells[i].k === 'lock') S.cells[i] = null; }
  return row;
}

/* ================= merge input ================= */
let drag = null;
function idxAt(board, cols, rows, x, y) {
  const r = board.getBoundingClientRect(), size = r.width / cols;
  const cx = Math.floor((x - r.left) / size), cy = Math.floor((y - r.top) / size);
  if (cx < 0 || cy < 0 || cx >= cols || cy >= rows) return -1;
  return cy * cols + cx;
}
const mb = $('mboard');
mb.addEventListener('pointerdown', e => {
  if (!S || S.view !== 'merge' || drag || !$('overlay').hidden) return;
  const i = idxAt(mb, COLS, ROWS, e.clientX, e.clientY);
  if (i < 0) return;
  e.preventDefault();
  try { mb.setPointerCapture(e.pointerId); } catch (err) {}
  drag = { i, x: e.clientX, y: e.clientY, id: e.pointerId, moving: false, dead: false, ghost: null, over: -1 };
});
mb.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || drag.dead) return;
  if (!drag.moving) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 9) return;
    const c = S.cells[drag.i];
    if (!c || c.k === 'lock' || isGim(c)) { drag.dead = true; return; }
    drag.moving = true;
    const g = document.createElement('div');
    g.className = 'ghost';
    g.innerHTML = c.k === 'gen' ? CHAINS[c.g].gen.e : c.k === 'vault' ? VAULT : cellArt(c);
    g.style.width = g.style.height = (mb.clientWidth / COLS) * 1.05 + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    mEls[drag.i].classList.add('lift');
    if (c.k !== 'gen' && c.k !== 'vault') showDropZones(c);
    if (c.k === 'item') S.cells.forEach((o, j) => { if (j !== drag.i && (sameItem(c, o) || (o && gimFits(c, o)))) mEls[j].classList.add('match'); });
  }
  drag.ghost.style.transform = `translate(${e.clientX}px,${e.clientY}px) translate(-50%,-70%) scale(1.15)`;
  const z = zoneAt(e.clientX, e.clientY);
  document.querySelectorAll('#info .dz').forEach(el => el.classList.toggle('on', el.dataset.dz === z));
  const over = idxAt(mb, COLS, ROWS, e.clientX, e.clientY);
  if (over !== drag.over) {
    (drag.hl || []).forEach(j => mEls[j].classList.remove('hover', 'can'));
    drag.hl = [];
    drag.over = over;
    const oc = over >= 0 ? S.cells[over] : null;
    if (over >= 0 && over !== drag.i && !(oc && oc.k === 'lock')) {
      const s = S.cells[drag.i];
      if (sameItem(s, oc) && s.t < MAXT) {
        const g = cluster(over, drag.i);
        drag.hl = g.length + 1 >= 5 ? g : [over];
      } else drag.hl = [over];   // final stage pairs make a relic, one at a time
      const fits = sameItem(s, oc) || (oc && (gimFits(s, oc) || (oc.k === 'vault' && s.k !== 'gen') || (oc.k === 'gift' && s.k === 'gift')));
      drag.hl.forEach(j => mEls[j].classList.add(fits ? 'can' : 'hover'));
    }
  }
});
function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag;
  drag = null;
  if (d.ghost) d.ghost.remove();
  mEls.forEach(el => el.classList.remove('match', 'hover', 'can', 'lift'));
  const z = d.moving && !cancelled ? zoneAt(e.clientX, e.clientY) : null;
  if (d.moving) renderInfo();   // put the info panel back in place of the drop zones
  if (cancelled) { paintM(d.i); return; }
  if (z === 'store') stash(d.i);
  else if (z === 'abyss') toAbyss(d.i);
  else if (d.moving) drop(d.i, idxAt(mb, COLS, ROWS, e.clientX, e.clientY));
  else if (!d.dead) tapM(d.i);
  else select(d.i);
}
mb.addEventListener('pointerup', e => endDrag(e, false));
mb.addEventListener('pointercancel', e => endDrag(e, true));

/* ================= search (hidden-object scene) ================= */
function mulberry(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const newSearch = ch => ({ seed: (Math.random() * 1e9) | 0, ch, found: [], stage: stageOf(), ex: (S.used || []).slice(), mode: isDiffStage() ? 'diff' : undefined });

// Everything about a scene comes from its seed, so a saved search redraws identically.
// Listed items are hidden with hidden-object tricks: blending into busy areas, odd sizes,
// odd angles, lining up with boards and posts, blind spots, and being partly covered.
function layoutScene(s) {
  if (theme(s.ch).hs && HIDDEN[theme(s.ch).hs]) return layoutHidden(s, theme(s.ch));
  // Until a chapter has its own drawn-in picture, use one that does.
  const drawn = THEMES.find(t => t.hs && HIDDEN[t.hs]);
  if (drawn) return layoutHidden(s, drawn);
  const R = mulberry(s.seed), th = theme(s.ch), spots = SPOTS[th.bg];
  const rp = a => a[Math.floor(R() * a.length)];
  const rr = (a, b) => a + R() * (b - a);
  const sh = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let targets = sh(th.items.filter(e => FINDS[e])).slice(0, findCount(s.ch));
  const clutter = th.items.filter(e => !targets.includes(e));
  targets.forEach(e => { const l = LOOKALIKE[e]; if (l && !targets.includes(l)) clutter.push(l, l); });

  const spotOf = (kinds, id) => {
    const c = spots.filter(p => kinds.includes(p.k) && (p.k !== 'sky' || FLY.has(id)));
    return c.length ? rp(c) : rp(spots.filter(p => p.k === 'floor'));
  };
  // Natural size for a spot, before any trick changes it.
  const place = (id, p) => {
    const x = rr(p.x0, p.x1) * SW;
    let y, s, r = rr(-12, 12);
    if (p.k === 'shelf') { s = rr(66, 90); y = p.y0 * SH - s * .36; r = rr(-6, 6); }
    else {
      y = rr(p.y0, p.y1) * SH;
      if (p.k === 'floor') { const d = (y / SH - p.y0) / Math.max(.01, p.y1 - p.y0); s = rr(96, 136) * (.75 + d * .5); r = rr(-40, 40); }
      else if (p.k === 'sky') s = rr(56, 76);
      else if (p.k === 'busy') s = rr(62, 86);
      else s = rr(72, 98);
    }
    return { e: id, x, y, s, r, a: 1, flip: R() < .3, kind: p.k };
  };

  const items = [];
  const T = [];
  const free = (x, y, gap) => T.every(t => Math.hypot(t.x - x, t.y - y) > gap);
  const safe = it => it.x > 140 && it.x < SW - 260 && it.y > 80 && it.y < SH - 150;
  const tricks = ['natural', 'busy', 'flip', 'behind', 'line', 'busy'];
  if (s.ch >= 1) tricks.push('tiny', 'edge', 'flip');
  if (s.ch >= 2) tricks.push('huge', 'tiny', 'behind', 'edge');

  targets.forEach((id, k) => {
    for (let tries = 0; tries < 40; tries++) {
      const trick = tries < 30 ? rp(tricks) : 'natural';
      let it, over = null;
      if (trick === 'busy') { it = place(id, spotOf(['busy'], id)); it.s *= .9; it.a = .72; }
      else if (trick === 'tiny') { it = place(id, spotOf(['floor', 'shelf', 'busy'], id)); it.s = rr(40, 50); it.a = .9; }
      else if (trick === 'huge') { it = place(id, spotOf(['floor', 'hang'], id)); it.s = rr(240, 320); it.a = .4; }
      else if (trick === 'flip') { it = place(id, spotOf(['floor', 'shelf', 'hang', 'busy'], id)); it.r = rp([180, 90, -90]) + rr(-8, 8); it.a = .88; }
      else if (trick === 'edge') { it = place(id, spotOf(['edge'], id)); it.a = .85; }
      else if (trick === 'line' && LONG.has(id)) {
        it = place(id, spotOf(['floor', 'edge'], id));
        it.r = rp([90, -90, 0, 180]) + rr(-5, 5); it.a = .85;   // follows boards, posts and ledges
      } else if (trick === 'behind') {
        it = place(id, spotOf(['floor', 'shelf'], id)); it.a = .95;
        const cover = rp(clutter);
        over = { e: cover, x: it.x + rp([-1, 1]) * it.s * rr(.3, .42), y: it.y + it.s * rr(.1, .3), s: it.s * rr(1.05, 1.3), r: rr(-15, 15), a: 1, flip: R() < .5, over: true };
      } else { it = place(id, spotOf(['floor', 'shelf', 'hang', 'busy', 'sky'], id)); it.a = .92; }
      if (!safe(it) || !free(it.x, it.y, 260)) continue;
      it.t = k; it.trick = trick;
      T.push(it);
      items.push(it);
      if (over) items.push(over);
      return;
    }
  });
  targets = targets.slice(0, T.length);
  T.forEach((t, k) => { t.t = k; });

  // Decoys: fewer than before, all sitting where things would really be. Lookalikes included.
  const n = 90 + s.ch * 8;
  const kinds = ['floor', 'floor', 'floor', 'shelf', 'shelf', 'shelf', 'hang', 'hang', 'busy', 'busy', 'busy', 'edge', 'edge', 'sky'];
  for (let k = 0, tries = 0; k < n && tries < n * 6; tries++) {
    const id = rp(clutter);
    const it = place(id, spotOf([rp(kinds)], id));
    // never sit on top of a listed item (only its chosen cover may)
    if (T.some(t => Math.hypot(t.x - it.x, t.y - it.y) < (t.s + it.s) * .4)) continue;
    if (items.some(o => !o.over && o.t === undefined && Math.hypot(o.x - it.x, o.y - it.y) < (o.s + it.s) * .22)) continue;
    it.a = rr(.85, 1);
    items.push(it);
    k++;
  }
  // back to front; a cover is drawn right after the item it hides
  items.forEach(it => { it.z = it.over ? it.y + 2000 : it.y; });
  items.sort((a, b) => a.z - b.z);
  return { seed: s.seed, th, items, T };
}

const imgCache = new Map();
function loadImg(src) {
  if (!imgCache.has(src)) imgCache.set(src, new Promise((ok, fail) => {
    const im = new Image();
    im.onload = () => ok(im);
    im.onerror = () => fail(new Error(src));
    im.src = src;
  }));
  return imgCache.get(src);
}
const sprites = {};

// Engravings sit on white paper, so multiply lets the backdrop show through the white.
function drawItem(g, it) {
  const im = sprites[it.e];
  if (!im) return;
  g.save();
  g.globalCompositeOperation = 'multiply';
  g.globalAlpha = it.a == null ? 1 : it.a;
  g.translate(it.x, it.y);
  g.rotate(it.r * Math.PI / 180);
  if (it.flip) g.scale(-1, 1);
  g.drawImage(im, -it.s / 2, -it.s / 2, it.s, it.s);
  g.restore();
}
// A found item is coloured in with a watercolour wash, then its lines are re-inked on top.
function drawFound(g, t) {
  const col = WASH[(t.e.length * 7 + t.e.charCodeAt(0)) % WASH.length];
  const r = Math.max(30, t.s * .5);
  g.save();
  g.globalCompositeOperation = 'multiply';
  const gr = g.createRadialGradient(t.x, t.y, 0, t.x, t.y, r);
  gr.addColorStop(0, col + '.8)');
  gr.addColorStop(.65, col + '.55)');
  gr.addColorStop(1, col + '0)');
  g.fillStyle = gr;
  g.beginPath(); g.arc(t.x, t.y, r, 0, Math.PI * 2); g.fill();
  g.restore();
  drawItem(g, Object.assign({}, t, { a: 1 }));
}

let scn = null;
async function renderScene() {
  const s = S.search, cv = $('scv');
  $('sload').hidden = false;
  $('sload').textContent = '情景を描いています…';
  $('slayer').querySelectorAll('.mark,.hintring,.miss,.float').forEach(el => el.remove());
  const L = layoutScene(s);
  const ids = [...new Set(L.items.map(it => it.e))];
  let bg;
  try {
    [bg] = await Promise.all([loadImg(`assets/${L.hidden ? L.th.hs : L.th.bg}.jpg`), ...ids.map(id => loadImg(findSrc(id)).then(im => { sprites[id] = im; }))]);
  } catch (e) {
    $('sload').textContent = '画像を読み込めませんでした。通信状態を確認して、もう一度開いてください。';
    return;
  }
  if (!S.search || S.search.seed !== s.seed) return;   // the player left or changed scene meanwhile
  cv.width = SW * SRES; cv.height = SH * SRES;
  cv.style.width = SW + 'px'; cv.style.height = SH + 'px';
  $('slayer').style.width = SW + 'px'; $('slayer').style.height = SH + 'px';
  const g = cv.getContext('2d');
  g.setTransform(SRES, 0, 0, SRES, 0, 0);
  const k = Math.max(SW / bg.width, SH / bg.height);
  g.drawImage(bg, (SW - bg.width * k) / 2, (SH - bg.height * k) / 2, bg.width * k, bg.height * k);
  L.items.forEach(it => drawItem(g, it));
  // In a seek-and-find picture, the list shows each item cut straight out of the picture.
  if (L.hidden) L.T.forEach(t => {
    const [x, y, r] = t.at[0].src, c = document.createElement('canvas');
    c.width = c.height = 192;   // shown at up to ~130 CSS px, sharp on Retina
    c.getContext('2d').drawImage(bg, x - r * 1.15, y - r * 1.15, r * 2.3, r * 2.3, 0, 0, 192, 192);
    t.thumb = c.toDataURL('image/jpeg', .85);
  });
  L.T.forEach(t => {
    // colour in the copies already tapped (older saves only know that the item was found: use its first copy)
    const parts = (s.parts || {})[t.t] || (s.found.includes(t.t) ? [0] : []);
    parts.forEach(n => { const p = t.at ? t.at[n] : t; if (!p) return; const at = Object.assign({}, t, { x: p.x, y: p.y, s: p.s }); drawFound(g, at); addMark(at); });
  });
