  const RB = mulberry(s.seed + 7), blurN = s.ch >= 2 ? Math.min(3, s.ch - 1) : 0;
  L.T.filter(t => !t.all).map(t => [RB(), t]).sort((a, b) => a[0] - b[0]).slice(0, blurN).forEach(([, t]) => { t.blur = true; });
  scn = L;
  $('sload').hidden = true;
  fitView();
  renderFinds();
}

/* ---- view: pinch zoom / pan ---- */
const V = { z: 1, x: 0, y: 0, min: .2, max: 2 };
function applyView(glide) {
  const r = $('sview').getBoundingClientRect();
  V.z = Math.min(V.max, Math.max(V.min, V.z));
  const w = SW * V.z, h = SH * V.z;
  V.x = w <= r.width ? (r.width - w) / 2 : Math.min(0, Math.max(r.width - w, V.x));
  V.y = h <= r.height ? (r.height - h) / 2 : Math.min(0, Math.max(r.height - h, V.y));
  const L = $('slayer');
  L.classList.toggle('glide', !!glide);
  L.style.transform = `translate(${V.x}px,${V.y}px) scale(${V.z})`;
  L.style.setProperty('--inv', 1 / V.z);
}
function fitView() {
  const r = $('sview').getBoundingClientRect();
  if (!r.width || !r.height) return;
  V.min = Math.min(r.width / SW, r.height / SH);
  V.max = Math.max(V.min * 6, 1.5);
  // Open filling the frame (no letterbox), centred on the crowded lower half.
  V.z = Math.min(Math.max(r.width / SW, r.height / SH), V.min * 2.2);
  V.x = (r.width - SW * V.z) / 2;
  V.y = r.height - SH * V.z * .82;
  applyView();
}
function zoomAt(f, cx, cy, glide) {
  const wx = (cx - V.x) / V.z, wy = (cy - V.y) / V.z;
  V.z = Math.min(V.max, Math.max(V.min, V.z * f));
  V.x = cx - wx * V.z; V.y = cy - wy * V.z;
  applyView(glide);
}
function onSviewResize() {
  if (!scn) return;
  const r = $('sview').getBoundingClientRect();
  if (!r.width) return;
  const atMin = V.z <= V.min + 1e-6;
  V.min = Math.min(r.width / SW, r.height / SH);
  V.max = Math.max(V.min * 6, 1.5);
  if (atMin || V.z < V.min) V.z = V.min;
  applyView();
}

const sv = $('sview'), ptrs = new Map();
let gest = null;
const local = e => { const r = sv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
sv.addEventListener('pointerdown', e => {
  if (!scn || S.view !== 'search' || !$('overlay').hidden || e.target.closest('button')) return;
  e.preventDefault();
  try { sv.setPointerCapture(e.pointerId); } catch (err) {}
  const p = local(e);
  ptrs.set(e.pointerId, p);
  if (ptrs.size === 1) gest = { mode: 'tap', sx: p.x, sy: p.y, vx: V.x, vy: V.y };
  else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    gest = { mode: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, z: V.z, vx: V.x, vy: V.y };
    $('ptip').hidden = true;
  }
});
sv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || !gest) return;
  const p = local(e);
  ptrs.set(e.pointerId, p);
  if (gest.mode === 'pinch') {
    if (ptrs.size < 2) return;
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const wx = (gest.mx - gest.vx) / gest.z, wy = (gest.my - gest.vy) / gest.z;
    V.z = Math.min(V.max, Math.max(V.min, gest.z * d / gest.d));
    V.x = mx - wx * V.z; V.y = my - wy * V.z;
    applyView();
    return;
  }
  const dx = p.x - gest.sx, dy = p.y - gest.sy;
  if (gest.mode === 'tap' && Math.hypot(dx, dy) > 9) { gest.mode = 'pan'; $('ptip').hidden = true; }
  if (gest.mode === 'pan') { V.x = gest.vx + dx; V.y = gest.vy + dy; applyView(); }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  const p = ptrs.get(e.pointerId);
  ptrs.delete(e.pointerId);
  if (gest && gest.mode === 'tap' && e.type === 'pointerup') tapWorld((p.x - V.x) / V.z, (p.y - V.y) / V.z);
  if (!ptrs.size) gest = null;
  else if (gest && gest.mode === 'pinch') { const q = [...ptrs.values()][0]; gest = { mode: 'pan', sx: q.x, sy: q.y, vx: V.x, vy: V.y }; }
}
sv.addEventListener('pointerup', endPtr);
sv.addEventListener('pointercancel', endPtr);
sv.addEventListener('wheel', e => {
  if (!scn) return;
  e.preventDefault();
  const p = local(e);
  zoomAt(Math.exp(-e.deltaY * .0015), p.x, p.y);
}, { passive: false });
const zoomCenter = f => { const r = sv.getBoundingClientRect(); zoomAt(f, r.width / 2, r.height / 2, true); };
$('zin').addEventListener('click', () => zoomCenter(1.6));
$('zout').addEventListener('click', () => zoomCenter(1 / 1.6));
$('zfit').addEventListener('click', () => { V.z = V.min; applyView(true); });

/* ---- finding ---- */
function inWorld(cls, x, y, size, text) {
  const el = document.createElement('div');
  el.className = cls;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  if (size) el.style.width = el.style.height = size + 'px';
  if (text) el.textContent = text;
  $('slayer').appendChild(el);
  return el;
}
const addMark = t => inWorld('mark', t.x, t.y, t.s * 1.3);

function tapWorld(wx, wy) {
  const s = S.search;
  const slop = Math.min(16 / V.z, 26);   // finger tolerance, capped so tapping zoomed-out isn't a free pass
  s.parts = s.parts || {};
  const got = t => s.parts[t.t] || [];
  const near = scn.T.filter(t => !s.found.includes(t.t))
    .flatMap(t => (t.at || [t]).map((p, n) => ({ t, p, n, d: Math.hypot(p.x - wx, p.y - wy) })))
    .filter(o => o.d < o.p.s * .55 + slop)
    .sort((a, b) => a.d - b.d)[0];
  // A "find them all" copy counts once: tapping one already found again does nothing (not a miss, not its neighbour).
  if (near && got(near.t).includes(near.n)) return;
  const hit = near;
  if (hit) {
    const t = hit.t, at = Object.assign({}, t, { x: hit.p.x, y: hit.p.y, s: hit.p.s });
    s.parts[t.t] = got(t).concat(hit.n);   // which copy was tapped, so a reload colours the same one
    const total = t.all ? t.at.length : 1, n = s.parts[t.t].length;
    if (n >= total) s.found.push(t.t);
    drawFound($('scv').getContext('2d'), at);
    addMark(at);
    const f = inWorld('float sfloat ok', at.x, at.y - at.s * .7, 0, `${t.ja || FINDS[t.e]}${t.all ? ` ${n}/${total}` : ''}！`);
    setTimeout(() => f.remove(), 1200);
    sfx.found();
    renderFinds();
    save();
    if (s.found.length >= scn.T.length) setTimeout(searchClear, 1300);
  } else {
    s.miss = (s.miss || 0) + 1;
    const m = inWorld('miss', wx, wy, 0, '×');
    const f = inWorld('float sfloat bad', wx, wy - 30 / V.z, 0, 'SAN −6');
    setTimeout(() => f.remove(), 1000);
    renderFinds();
    save();
    setTimeout(() => m.remove(), 700);
    sfx.wrong();
  }
}

function renderFinds() {
  if (!S.search || !scn) return;
  const s = S.search, T = scn.T.slice().sort((a, b) => (b.all ? 1 : 0) - (a.all ? 1 : 0) || a.t - b.t);   // "find them all" card first
  $("mTitle").textContent = `${story(s.ch).mission}${s.replay ? "" : `（${(s.stage || 0) + 1}/${STAGES}）`}　${s.found.length} / ${T.length}`;
  const san = sanOf(s);
  $('san').textContent = `SAN ${san}　${starsText(rateOf(san))}`;
  $('san').className = 'san r' + rateOf(san);
  $('sview').classList.toggle('shaken', san < 45);
  $('finds').innerHTML = T.map(t => {
    const cnt = t.all ? `<b class="cnt">${((s.parts || {})[t.t] || []).length} / ${t.at.length}</b>` : '';
    return `<span class="find${t.all ? ' all' : ''}${t.blur ? ' blur' : ''}${s.found.includes(t.t) ? ' got' : ''}"><img src="${t.thumb || findSrc(t.e)}" alt="">${cnt}<span class="nm">${t.ja || FINDS[t.e]}</span></span>`;
  }).join('');
  renderTop();
}

function useEye() {
  if (!scn || S.eyes <= 0) return;
  const left = scn.T.filter(t => !S.search.found.includes(t.t));
  if (!left.length) return;
  S.eyes--;
  if (!modOn('calm')) S.search.eyes = (S.search.eyes || 0) + 1;

  const done = (S.search.parts || {})[pt.t] || [];

  V.z = Math.min(V.max, Math.max(V.z, V.min * 3));

/* ================= spot the difference (each chapter's second search) ================= */
// Two copies of a coloured scene; the second gets N patches changed: an object rubbed out, recoloured, mirrored or turned.
// Where to change is picked from the busiest (most detailed) parts of the picture, so changes land on things, not on sky.
const isDiffStage = () => stageOf() === 1;
const DIFF_TITLES = ['記憶の中の酒場', '食いちがう朝市', 'ゆがんだ集会所', '月下の波止場', '祭りの夜の違和感', '夢の都のほころび'];
const diffCount = ch => Math.min(5 + Math.floor(ch / 2), 8);
const diffImg = ch => `assets/bg-df${ch === FINAL_CH ? 5 : ch % 6}.jpg`;
let dscn = null;
async function renderDiff() {
  const s = S.search;
  $('dload').hidden = false;
  $('dpanes').querySelectorAll('.dmark,.miss,.hintring').forEach(el => el.remove());
  let im;
  try { im = await loadImg(diffImg(s.ch)); } catch (e) { $('dload').textContent = '画像を読み込めませんでした。通信状態を確認して、もう一度開いてください。'; return; }
  if (!S.search || S.search.seed !== s.seed) return;
  const W = im.naturalWidth, H = im.naturalHeight;
  const A = $('dA'), B = $('dB');
  A.width = B.width = W; A.height = B.height = H;
  const ga = A.getContext('2d'), gb = B.getContext('2d');
  ga.drawImage(im, 0, 0); gb.drawImage(im, 0, 0);
  // Detail map: luminance spread in 40px cells.
  const px = ga.getImageData(0, 0, W, H).data, C = 40, cells = [];
  for (let y = C; y < H - 2 * C; y += C) for (let x = C; x < W - 2 * C; x += C) {
    let n = 0, sum = 0, sq = 0;
    for (let yy = y; yy < y + C; yy += 4) for (let xx = x; xx < x + C; xx += 4) {
      const i = (yy * W + xx) * 4, l = .3 * px[i] + .59 * px[i + 1] + .11 * px[i + 2];
      sum += l; sq += l * l; n++;
    }
    const m = sum / n;
    cells.push({ x: x + C / 2, y: y + C / 2, v: sq / n - m * m });
  }
  cells.sort((a, b) => b.v - a.v);
  const R = mulberry(s.seed), top = cells.slice(0, Math.floor(cells.length * .35));
  const want = diffCount(s.ch), pts = [], minD = Math.min(W, H) / (want > 6 ? 4.2 : 3.6);
  for (let tries = 0; pts.length < want && tries < 4000; tries++) {
    const c = top[Math.floor(R() * top.length)];
    if (pts.every(p => Math.hypot(p.x - c.x, p.y - c.y) > minD)) pts.push({ x: c.x, y: c.y, r: 34 + Math.floor(R() * 14) });
  }
  const KINDS = ['gone', 'hue', 'flip', 'tint', 'rot', 'gone'];
  pts.forEach((p, i) => { p.k = KINDS[(i + Math.floor(R() * 6)) % KINDS.length]; diffPatch(ga, gb, p, W, H); });
  dscn = { seed: s.seed, pts, W, H };
  $('dload').hidden = true;
  layoutDiff();
  (s.found || []).forEach(i => markDiff(i, false));
  renderDiffHead();
}
// Paint one change into the second picture with a soft round edge.
function diffPatch(ga, gb, p, W, H) {
  const d = p.r * 2, pc = document.createElement('canvas');
  pc.width = pc.height = d;
  const g = pc.getContext('2d');
  let sx = p.x - p.r, sy = p.y - p.r;
  if (p.k === 'gone') { sx += (p.x + p.r * 3 < W ? 1 : -1) * p.r * 2.4; }   // a nearby patch of background covers the thing
  if (p.k === 'flip' || p.k === 'rot') {
    g.translate(d / 2, d / 2);
    if (p.k === 'flip') g.scale(-1, 1); else g.rotate(Math.PI);
    g.drawImage(ga.canvas, sx, sy, d, d, -d / 2, -d / 2, d, d);
    g.setTransform(1, 0, 0, 1, 0, 0);
  } else g.drawImage(ga.canvas, sx, sy, d, d, 0, 0, d, d);
  if (p.k === 'hue' || p.k === 'tint') {
    const im = g.getImageData(0, 0, d, d), q = im.data;
    for (let i = 0; i < q.length; i += 4) {
      const [r0, g0, b0] = [q[i], q[i + 1], q[i + 2]];
      if (p.k === 'hue') { q[i] = b0; q[i + 1] = r0; q[i + 2] = g0; }
      else { q[i] = Math.min(255, r0 * 1.25 + 50); q[i + 1] = g0 * .62; q[i + 2] = b0 * .62; }
    }
    g.putImageData(im, 0, 0);
  }
  g.globalCompositeOperation = 'destination-in';
  const grad = g.createRadialGradient(d / 2, d / 2, p.r * .55, d / 2, d / 2, p.r);
  grad.addColorStop(0, 'rgba(0,0,0,1)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, 0, d, d);
  gb.drawImage(pc, p.x - p.r, p.y - p.r);
}
// Fit both pictures: side by side when that is bigger, otherwise one above the other.
function layoutDiff() {
  if (!dscn) return;
  const box = $('dpanes'), r = box.getBoundingClientRect(), gap = 10, ar = dscn.W / dscn.H;
  const side = Math.min((r.width - gap) / 2, r.height * ar), stack = Math.min(r.width, (r.height - gap) / 2 * ar);
  const w = Math.max(side, stack), h = w / ar;
  box.classList.toggle('stack', stack > side);
  box.querySelectorAll('canvas').forEach(c => { c.style.width = w + 'px'; c.style.height = h + 'px'; });
  box.querySelectorAll('.dmark').forEach(el => placeMark(el));
}
function placeMark(el) {
  const c = el.parentNode.querySelector('canvas'), k = c.clientWidth / dscn.W;
  const p = dscn.pts[+el.dataset.i] || { x: +el.dataset.x, y: +el.dataset.y, r: +el.dataset.r };
  el.style.left = c.offsetLeft + p.x * k + 'px'; el.style.top = c.offsetTop + p.y * k + 'px';
  el.style.width = el.style.height = p.r * 2.3 * k + 'px';
}
function markDiff(i, fresh) {
  document.querySelectorAll('#dpanes .dpane').forEach(pane => {
    const m = document.createElement('div');
    m.className = 'dmark' + (fresh ? ' fresh' : '');
    m.dataset.i = i;
    pane.appendChild(m);
    placeMark(m);
  });
}
function renderDiffHead() {

}
$('dpanes').addEventListener('pointerup', e => {
  const c = e.target.closest('canvas');
  if (!c || !dscn || !S.search || S.search.mode !== 'diff') return;
  const rc = c.getBoundingClientRect(), k = dscn.W / rc.width;
  const x = (e.clientX - rc.left) * k, y = (e.clientY - rc.top) * k, s = S.search;
  const hit = dscn.pts.map((p, i) => ({ p, i, d: Math.hypot(p.x - x, p.y - y) }))
    .filter(o => o.d < o.p.r * 1.25 + 14 * k).sort((a, b) => a.d - b.d)[0];
  if (hit && s.found.includes(hit.i)) return;
  if (hit) {
    s.found.push(hit.i);
    markDiff(hit.i, true);

// The rating block shown when a search is solved: stars, sanity left and the chapter's record.
const rateHtml = (r, san, stats) => `<div class="rating r${r}">${starsText(r)}</div>
    <p class="muted">残った正気度 <b>${san}</b>${stats ? `　／　合体 ${stats.m}回・依頼 ${stats.o}件・しかけ ${stats.g}個` : ''}</p>`;
// A new title for the total of best ratings; each step pays once.
function titleUp(list) {
  const lv = titleLv();

  S.titleLv = lv;
  const coins = 60 * lv;

  return `<p class="title-up">称号が上がった：<b>${TITLES[lv][1]}</b></p>`;
}

function searchClear() {
  const s = S.search, san = sanOf(s), r = rateOf(san);
  S.log = S.log || {};
  if (s.replay) return replayClear(s, san, r);
  bumpTot('f', s.mode === 'diff' ? (s.found || []).length : scn ? scn.T.length : 0);
  if (r === 3) bumpTot('s3', 1);
  S.rates = (S.rates || []).concat(r);
  if (!lastStage()) return stageClear(s, san, r);
  const ch = S.ch, st = story(ch);
  const coins = 40 + 30 * ch;
  const list = [`🪙 ${coins}`, '👁️ 千里眼 ×2'];
  S.coins += coins;
  S.eyes += 2;
  if (RATE_COINS(ch)[r]) { S.coins += RATE_COINS(ch)[r]; list.push(`${starsText(r)} 評価ボーナス 🪙${RATE_COINS(ch)[r]}`); }
  if (r === 3) { S.eyes += 1; list.push('👁️ 正気を保ったほうび ×1'); }
  const stats = Object.assign({ m: 0, o: 0, g: 0 }, S.cs);
  const rates = S.rates.slice(), cr = Math.max(1, Math.round(rates.reduce((a, b) => a + b, 0) / rates.length));   // the chapter rating: all its searches
  S.log[ch] = { stars: cr, san, m: stats.m, o: stats.o, g: stats.g };
  const titleHtml = titleUp(list);
  const row = unlockRow();

  const gift = [];

  const avail = [0, 1, 2].filter(g => S.gens[g]);

    list.push(`${ITEM(c, gt)[0]} ${ITEM(c, gt)[1]}`);

// Re-running a solved chapter's scene: only a better rating pays (the difference), the story doesn't move.
function replayClear(s, san, r) {
  const ch = s.ch, prev = S.log[ch] || { stars: 0, san: 0, m: 0, o: 0, g: 0 };
  const list = [];
  let head = 'これまでの記録は超えられなかった。';
  if (r > prev.stars) {
    const coins = RATE_COINS(ch)[r] - RATE_COINS(ch)[prev.stars];
    if (coins > 0) { S.coins += coins; list.push(`評価が上がった 🪙${coins}`); }
    if (r === 3) { S.eyes += 1; list.push('👁️ 正気を保ったほうび ×1'); }
    head = '記録を塗りかえた！';
  }
  S.log[ch] = Object.assign({}, prev, { stars: Math.max(prev.stars, r), san: Math.max(prev.san, san) });
  const titleHtml = titleUp(list);
  S.search = null;
  scn = null;
  setView('merge');
  afterChange();
  sfx.seal();
  showOverlay(`
    <p class="kicker">第${ch + 1}章 再調査</p>
    <h2>${story(ch).mission}</h2>
    ${rateHtml(r, san)}
    <p class="lore">${head}</p>
    ${titleHtml}
    ${list.length ? `<ul class="rewards">${list.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}

  `, hideOverlay);
}

  '「ルルイエの館にて、死せるクトゥルフ、夢見るままに待ちいたり」。その言葉の意味を、あなたはもう知っている。',

  'ふんぐるい　むぐるうなふ　くとぅるう　るるいえ　うがふなぐる　ふたぐん',

function showEnding(replay) {
  const E = $('ending'), T = $('etext'), R = $('eroll');
  E.hidden = false; E.classList.remove('roll', 'wake'); R.innerHTML = ''; T.innerHTML = '';
  stopDrone();
  let i = 0, timer = 0, stage = 'story';
  // After the credits: you wake up, and it isn't over. Lines appear one by one on a dark screen.
  const epilogue = () => {
    if (stage === 'epi') return;
    stage = 'epi';
    clearTimeout(timer);
    E.classList.remove('roll'); E.classList.add('wake');
    R.innerHTML = ''; T.innerHTML = '';
    $('eskip').hidden = true;
    let j = 0;
    const step = () => {
      clearTimeout(timer);
      if (j < EPILOGUE.length) {
        const last = j === EPILOGUE.length - 1;
        T.insertAdjacentHTML('beforeend', `<p class="wline${last ? ' whisper' : ''}">${EPILOGUE[j++]}</p>`);
        if (last) { sfx.abyss(); timer = setTimeout(step, 5200); } else { bubble(0, 300); timer = setTimeout(step, 3600); }
        return;
      }
      T.onclick = null;
      T.insertAdjacentHTML('beforeend', `${replay ? '' : '<p class="after">クリアのほうび：🪙1000　👁️5　実績「封印者」</p>'}
        <button class="btn primary wbtn" type="button" id="eend">${replay ? 'とじる' : 'その後の調査へ'}</button>`);
      $('eend').addEventListener('click', e => {
        e.stopPropagation();
        E.hidden = true; E.classList.remove('wake'); $('eskip').hidden = false;
        if (!muted) startDrone();
        if (!replay) showIntro();
      });
    };
    T.onclick = step;
    timer = setTimeout(step, 1800);
  };
  const finish = () => {
    if (stage !== 'story') { epilogue(); return; }
    stage = 'roll';
    clearTimeout(timer);
    E.classList.add('roll');
    T.innerHTML = '';
    T.onclick = null;
    R.innerHTML = `<div class="rollin">
      <h1>ルルイエ捜索録</h1><p class="rsub">― The R'lyeh Inquiry ―</p>
      <h3>企画</h3><p>yachi</p>
      <h3>探索者</h3><p>mitsu</p>
      <h3>物語・プログラム</h3><p>Claude</p>
      <h3>絵</h3><p>Gemini</p>
      <h3>依頼主</h3>${[...NPCS, ...BOSSES, MERCHANT].map(p => `<p>${p.n}</p>`).join('')}
      <h3>原典</h3><p>H・P・ラヴクラフト</p><p>『ダゴン』『クトゥルフの呼び声』</p><p>『インスマスを覆う影』『ダンウィッチの怪』</p>
    </div>`;
    R.querySelector('.rollin').addEventListener('animationend', () => setTimeout(epilogue, 1500));
    $('eskip').onclick = epilogue;
  };
  const next = () => {
    clearTimeout(timer);
    if (i >= ENDING.length) { finish(); return; }
    T.innerHTML = `<p class="eline">${ENDING[i++]}</p>`;
    sfx.discover();
    timer = setTimeout(next, 6500);
  };
  T.onclick = next;
  $('eskip').hidden = false;
  $('eskip').onclick = finish;
  if (!replay) { S.coins += 1000; S.eyes += 5; afterChange(); }
  setTimeout(next, 900);
}

    li(ITEM(0, 1)[0], '同じものを<b>ドラッグで重ねる</b>と合体して、ひとつ上のものになる。はじめて作ったものは図鑑に載り、ボーナスがもらえる。'),
    li('✨', '同じものを4つ以上となりあわせて並べ、そこへもう1つ重ねると<b>大合体</b>。ひとつ多くできる。高い段階の合体では、ときどき宝箱も出る。'),
    li(ITEM(1, 1)[0], '依頼主の品がそろったら「<b>納品</b>」。🪙と★がもらえる。依頼主の名前をタップすると、どんな人かわかる。'),
    li(GIFT, 'ほうびは盤面の<b>贈りもの</b>に入って届く。タップで開ける。贈りものどうしを重ねると、おまけが増える。'),
    li(VAULT, '盤面の<b>封印の櫃</b>に品を重ねると、しまっておける。タップで出せる。いらない品は、説明欄の<b>深淵</b>へドラッグすると🪙になる。'),
    li(ITEM(2, MAXT)[0], '最終段階どうしを重ねると<b>古き秘宝</b>になり、ずっと効く力をくれる。'),
  ];
  if (k === 'flow') return [
    li('<img class="uic" src="assets/x-ui-star.png" alt="">', '依頼をこなして★を集めると、<b>現場検証</b>ができる。1つの章に現場検証は<b>3回</b>。'),
    li('🔍', '1回目は<b>ミッケ</b>、2回目は<b>間違い探し</b>、3回目は<b>ミッケ</b>で真相に迫る。'),
    li(FACE(BOSSES[0].n), '3回目の前には、章の<b>山場の依頼</b>が届く。高い段階の品を納めると、最後の現場へ進める。'),
    li('📖', '解決した章は<b>手帳</b>の捜索録に残り、再調査でもっと良い評価を狙える。★の合計で<b>称号</b>が上がる。'),
  ];
  if (k === 'search') return [
    li('🔍', '細かく描かれた情景の中から、<b>リストの品</b>を探してタップ。見つけた品には色がつく。'),
    li('🔢', '「<b>全部</b>」の札の品は、絵の中にいくつもある。ぜんぶ見つけたら1つ完了。'),
    li('🌀', '「<b>おぼろ</b>」の札の品は、絵がぼやけている。名前を手がかりに探そう。'),
    li('🤏', '<b>ピンチで拡大</b>、ドラッグで移動。＋ − ボタンでも拡大できる。そっくりな品（鍵と古い鍵など）にも気をつけて。'),
    li('<img class="uic" src="assets/x-ui-eye.png" alt="">', '困ったら<b>千里眼</b>。だいたいの場所まで連れていってくれる。'),
    li('🧠', '<b>正気度（SAN）</b>：まちがえたタップは −6、千里眼は −12。最後に残った正気度で★評価が決まる（75以上で★★★）。'),
  ];
  if (k === 'diff') return [
    li('🖼️', '<b>記憶の光景</b>と<b>目の前の光景</b>、2枚の絵を見くらべて、<b>ちがう所</b>をタップ。どちらの絵をタップしてもいい。'),
    li('🎨', 'ちがいは、品が<b>消えている</b>、<b>色が変わっている</b>、<b>向きが逆</b>になっている、など。'),
    li('🤏', 'iPadを横にすると、2枚が左右に並んで見くらべやすい。'),
    li('<img class="uic" src="assets/x-ui-eye.png" alt="">', '困ったら<b>千里眼</b>。ちがいのあたりが光る。正気度のルールはミッケと同じ。'),
  ];
  if (k === 'gim') return Object.keys(GIMMICKS).map(g => li(g === 'fog' ? '<i class="fog mini"></i>' : g === 'stone' ? '<i class="stone-ic">石</i>' : TENT, `<b>${GIMMICKS[g].n}</b>：${GIMMICKS[g].d}`))
    .concat(li('🪙', '章のしかけをすべて解くと、🪙のほうびがある。'));
  if (k === 'daily') return [
    li('<img class="uic" src="assets/m-2-5.png" alt="">', '毎日、町に<b>異変</b>が起こる。満月の夜は宝箱が出やすい、など、その日だけの効果がある。'),
    li('📜', '<b>今日の調べもの</b>が3つ出る。こなすとほうび。3つともそろえると<b>月の贈りもの</b>。'),
    li('📅', '毎日つづけて調査すると<b>連続日数</b>がのび、ほうびが増える。'),
  ];
  return [
    li(MERCHANT ? FACE(MERCHANT.n) : '', '<b>骨董商の店</b>：千里眼、素材の包み、宝箱、依頼の入れかえ、封印をとく、古文書の頁。'),
    li(CHAINS[1].gen.e, '道具の<b>強化</b>、封印の櫃の<b>拡張</b>にも使える。'),
  ];
}
function showHelp(topic, first, after) {
  const k = topic || 'merge';
  showOverlay(`
    <p class="kicker">${first ? 'はじめての方へ' : '遊び方'}</p>
    <h2>${HELP_TOPICS.find(t => t[0] === k)[1]}</h2>
    ${first ? '' : `<div class="htabs">${HELP_TOPICS.map(([id, n]) => `<button class="btn tiny${id === k ? ' on' : ''}" type="button" data-topic="${id}">${n}</button>`).join('')}</div>`}
    <ul class="how">${helpBody(k).join('')}</ul>
    <button class="btn primary" type="button" data-go>${first ? 'わかった' : 'とじる'}</button>
  `, () => { hideOverlay(); if (after) after(); });
  $('panel').querySelectorAll('[data-topic]').forEach(b => b.addEventListener('click', () => showHelp(b.dataset.topic, false, after)));
}

function showDex() {
  const total = CHAINS.length * (MAXT + 1);
  const found = Object.keys(S.dex).length;
  const rows = CHAINS.map((ch, c) => `<div><h3>${ch.gen.e} ${ch.name}</h3><div class="dexrow">${ch.items.map((it, t) =>
    S.dex[key(c, t)] ? `<button class="dexitem" type="button" data-lore="${c}-${t}">${it[0]}<small>${it[1]}</small></button>` : `<div class="dexitem unknown">？<small>Lv${t + 1}</small></div>`).join('')}</div></div>`).join('')
    + `<div><h3>古き秘宝 <small class="muted">最終段階どうしを重ねると手に入る</small></h3><div class="relics">${RELICS.map((r, c) => {
      const n = (S.relics && S.relics[c]) || 0;
      return n ? `<div class="relic">${ITEM(c, MAXT)[0]}<div><b>${r.n} ×${n}</b><small>${r.d}${n >= r.max ? '（最大）' : ''}</small></div></div>`
        : `<div class="relic unknown"><span>？</span><div><b>？？？</b><small>${CHAINS[c].name}の最終段階を2つ重ねる</small></div></div>`;
    }).join('')}</div></div>`;
  // The investigation log: one page per chapter, with its best rating and a way back into its scene.
  const log = S.log || {}, lv = titleLv(), next = TITLES[lv + 1];
  const pages = [...Array(S.ch + 1).keys()].map(ch => {
    const e = log[ch], st = story(ch);
    if (ch === S.ch) return `<div class="page now"><div><b>第${ch + 1}章 ${st.title}</b><small>調査中…</small></div></div>`;
    return `<div class="page"><div><b>第${ch + 1}章 ${st.title}</b><small>${e ? `${st.mission}　SAN ${e.san}　合体${e.m}・依頼${e.o}・しかけ${e.g}` : `${st.mission}（記録なし）`}</small></div>
      <span class="pstars r${e ? e.stars : 0}">${starsText(e ? e.stars : 0)}</span>
      <button class="btn tiny" type="button" data-replay="${ch}" ${S.search ? 'disabled' : ''}>再調査</button></div>`;
  }).join('');
  // Clients: the townsfolk, then each chapter's climax client once that chapter is reached.
  const people = [...NPCS, MERCHANT].map(p => `<div class="page">${FACE(p.n)}<div><b>${p.n}</b><small class="desc">${p.d}</small></div></div>`).join('')
    + [...Array(BOSSES.length + (S.ch >= BOSSES.length ? 1 : 0)).keys()].map(ch => ch <= S.ch
      ? `<div class="page">${FACE(bossOf(ch).n)}<div><b>${bossOf(ch).n}<em class="pch">${ch < BOSSES.length ? `第${ch + 1}章` : `第${BOSSES.length + 1}章〜`} 山場</em></b><small class="desc">${bossOf(ch).d}</small></div></div>`
      : `<div class="page now"><div><b>？？？<em class="pch">第${ch + 1}章 山場</em></b><small>まだ会っていない</small></div></div>`).join('');
  showOverlay(`
    <p class="kicker">調査手帳</p>
    <h2>${TITLES[lv][1]}</h2>
    <div class="htabs"><button class="btn tiny" type="button" id="jHelp">遊び方</button>${S.cleared ? `<button class="btn tiny" type="button" id="jEnd">エンディングをもう一度見る</button>` : ""}</div>
    <p class="muted">評価の★ 合計 ${ratingSum()}${next ? `　／　次の称号「${next[1]}」まで あと${next[0] - ratingSum()}` : '　／　最高の称号'}</p>
    <div class="dex"><div><h3>捜索録 <small class="muted">再調査で★★★を狙える（よくなった分だけほうび）${S.search ? '　※進行中の現場検証を終えてから' : ''}</small></h3><div class="pages">${pages}</div></div>
      <div><h3>依頼主 <small class="muted">依頼カードの名前をタップしても見られる</small></h3><div class="pages">${people}</div></div>
      <div><h3>神話の手引き <small class="muted">${MYTHOS.filter((_, i) => mythOpen(i)).length} / ${MYTHOS.length}　章が進むと読める（店の「古文書の頁」でも）</small></h3><div class="pages">${MYTHOS.map((m, i) => mythOpen(i)
        ? `<details class="page myth"><summary><b>${m.n}</b></summary><p>${m.d}</p></details>`
        : `<div class="page now"><div><b>？？？</b><small>第${m.ch + 1}章で読める</small></div></div>`).join('')}</div></div>
      <div><h3>実績 <small class="muted">${(S.ach || []).length} / ${ACHS.length}　達成すると🪙や千里眼がもらえる</small></h3><div class="pages">${ACHS.map(a => { const [v, need] = a.p(), done = (S.ach || []).includes(a.id); return `<div class="page ach${done ? " done" : ""}"><div><b>${a.n}</b><small>${a.d}　${done ? "達成！" : `${Math.min(v, need)} / ${need}`}</small><i class="abar"><i style="width:${Math.min(100, v / need * 100)}%"></i></i></div><span class="rew">🪙${a.c}${a.e ? ` 👁️${a.e}` : ""}</span></div>`; }).join("")}</div></div></div>
    <h2 class="sub">図鑑 ${found} / ${total}</h2>
    <div class="lorebox" id="lorebox"><small>見つけた品をタップすると、クトゥルフ神話の解説が読める。</small></div>
    <div class="dex">${rows}</div>
    <button class="btn primary" type="button" data-go>とじる</button>
    <button class="btn tiny danger" type="button" id="resetBtn">データを消して最初から</button>
  `, hideOverlay);
  $('jHelp').addEventListener('click', () => showHelp('merge'));
  if ($('jEnd')) $('jEnd').addEventListener('click', () => { hideOverlay(); showEnding(true); });
  $('panel').querySelectorAll('[data-lore]').forEach(b => b.addEventListener('click', () => {
    const [c, t] = b.dataset.lore.split('-').map(Number), it = ITEM(c, t);
    $('lorebox').innerHTML = `<span class="lart">${it[0]}</span><div><b>${it[1]}<small>${CHAINS[c].name} Lv${t + 1}</small></b><p class="flav">${it[2]}</p><p>${ITEM_LORE[c][t]}</p></div>`;
    $('panel').querySelectorAll('.dexitem.on').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    $('lorebox').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }));
  $('panel').querySelectorAll('[data-replay]').forEach(b => b.addEventListener('click', () => {
    if (S.search) return;
    S.search = Object.assign(newSearch(+b.dataset.replay), { replay: true, stage: 0, ex: [], mode: undefined });
    hideOverlay();
    setView('search');
  }));
  let armed = false;
  $('resetBtn').addEventListener('click', () => {
    if (!armed) { armed = true; $('resetBtn').textContent = '本当に消す（もとに戻せません）'; return; }
    newGame();
  });
}
$('dexBtn').addEventListener('click', showDex);
$('mute').addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem('rlyeh-muted', muted ? '1' : '0'); } catch (e) {}
  renderTop();
  if (muted) stopDrone(); else { sfx.spawn(); startDrone(); }
});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
// iOS Safari can still double-tap-zoom despite touch-action. Cancel the second quick tap's default (the zoom)
// and deliver its click by hand, so rapid tapping on buttons keeps working. Pointer events are unaffected.
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = e.timeStamp;
  if (now - lastTouchEnd < 450 && !e.touches.length && !e.target.closest('input,textarea,select')) {
    e.preventDefault();
    if (e.target.click) e.target.click();
  }
  lastTouchEnd = now;
}, { passive: false });
// Offline cache for the home-screen install; only on a standalone host, not inside the artifact viewer.
if ('serviceWorker' in navigator && window.top === window && location.protocol === 'https:') {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}

/* ================= title screen ================= */
function newGame() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  freshState(); sel = -1; scn = null;
  setView('merge'); buildMerge(); renderAll();
  hideTitle();
  showIntro();
}
function hideTitle() {
  const t = $('title');
  t.classList.add('gone');
  setTimeout(() => { t.hidden = true; }, 600);
}
function showTitle(hasSave) {
  const t = $('title');
  t.hidden = false; t.classList.remove('gone');
  const where = `第${S.ch + 1}章「${story(S.ch).title}」`;
  $('tbtns').innerHTML = hasSave
    ? `<button class="btn primary tgo" type="button" data-t="go">つづきから<small>${where}</small></button>
       <button class="btn tb" type="button" data-t="new">はじめから</button>`
    : `<button class="btn primary tgo" type="button" data-t="go">ゲームスタート</button>`;
  $('tbtns').insertAdjacentHTML('beforeend', `<div class="trow">
    <button class="btn tb" type="button" data-t="help">遊び方</button>
    ${hasSave ? `<button class="btn tb" type="button" data-t="dex"><img class="uic" src="assets/x-ui-book.png" alt="">手帳</button>` : ''}
    <button class="btn tb snd${muted ? ' off' : ''}" type="button" data-t="snd"><img class="uic" src="assets/x-ui-sound.png" alt="">${muted ? '音：オフ' : '音：オン'}</button></div>`);
  let armed = false;
  $('tbtns').onclick = e => {
    const b = e.target.closest('[data-t]');
    if (!b) return;
    const k = b.dataset.t;
    if (k === 'go') {
      if (!muted) { sfx.seal(); startDrone(); }
      hideTitle();
      if (S.introCh !== S.ch) setTimeout(showIntro, 300);
      else if (dailyReady()) setTimeout(showDaily, 300);
    } else if (k === 'new') {
      if (!armed) { armed = true; b.classList.add('danger'); b.textContent = '本当に最初から？（セーブが消えます）'; return; }
      newGame();
    } else if (k === 'dex') showDex();
    else if (k === 'help') showHelp('merge');
    else if (k === 'snd') { $('mute').click(); showTitle(hasSave); }
  };
}

/* ================= boot ================= */
function renderAll() {
  renderOrders();
  renderTop();
  renderInfo();
  S.cells.forEach((_, i) => paintM(i));
}
function boot(data) {
  S = (data && data.S && data.S.v === 2) ? data.S : loadSave();
  const saved = S;
  if (!S) freshState();
  // Older saves: the climax request, chapter twists, board vault and board gifts are new.
  // Saves from before the three-search chapters: a search already under way is the chapter's last one.
  if (S.stage === undefined) {
    if (S.search && !S.search.replay) S.bossDone = true;
    S.stage = (S.boss || S.bossDone) ? STAGES - 1 : 0;
    if (S.search && !S.search.replay) S.search.stage = S.stage;
  }
  if (!S.search && lastStage() && S.stars >= goal(S.ch) && !S.bossDone && !S.boss) makeBoss();
  if (S.gimCh !== S.ch) placeGimmicks();
  ensureDaily();
  // Saves from before the help page already know how to play.
  if (!S.seen && S.introCh >= 0) S.seen = { merge: true, search: S.ch > 0, gim: S.ch > 1 };
  ensureVault();
  if (S.inbox.length && !S.inbox.some(x => x.k === 'gift')) { const list = S.inbox; S.inbox = []; giveGift(list); }
  fillOrders();
  sel = -1;
  buildMerge();
  renderAll();
  if (S.search && !S.search.seed) S.search = null;   // saves from the crowd-search version
  setView(S.search && S.view === 'search' ? 'search' : 'merge');
  showTitle(!!saved);
}
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ S })); } catch (e) {}
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
